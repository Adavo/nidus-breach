// ============ Transport : PeerJS (WebRTC), courtier gratuit pour la mise en relation uniquement ============
let peer=null;
const randCode=()=>Array.from({length:5},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.random()*32|0]).join('');
function wrapConn(c){
  const w={send:o=>c.send(o),close:()=>{try{c.close()}catch(e){}},onmsg:null,onclose:null};
  c.on('data',d=>w.onmsg&&w.onmsg(d));
  c.on('close',()=>w.onclose&&w.onclose());
  c.on('error',()=>w.onclose&&w.onclose());
  return w;
}
const peerTransport={
  host(onCode,onConn,onErr){
    if(typeof Peer==='undefined'){onErr(T('net.nopeer'));return}
    const tryId=()=>{
      const code=randCode();
      peer=new Peer('nidus-'+code,{debug:0});
      peer.on('open',()=>onCode(code));
      peer.on('connection',c=>{
        if(NET.conn){c.close();return}   // une seule personne à la fois
        c.on('open',()=>onConn(wrapConn(c)));
      });
      peer.on('error',err=>{if(err.type==='unavailable-id'){try{peer.destroy()}catch(e){}tryId()}else onErr(err.type||String(err))});
    };
    tryId();
  },
  join(code,onOpen,onErr){
    if(typeof Peer==='undefined'){onErr(T('net.nopeer'));return}
    peer=new Peer({debug:0});
    let done=false;
    const fail=m=>{if(!done){done=true;onErr(m)}};
    peer.on('error',err=>fail(err.type==='peer-unavailable'?T('net.nocode'):(err.type||String(err))));
    peer.on('open',()=>{
      const c=peer.connect('nidus-'+code,{reliable:true,serialization:'json'});
      c.on('open',()=>{if(!done){done=true;onOpen(wrapConn(c))}});
      setTimeout(()=>fail(T('net.timeout')),12000);
    });
  },
};
const TRANSPORT={host:(...a)=>(window.__TW_TRANSPORT||peerTransport).host(...a),join:(...a)=>(window.__TW_TRANSPORT||peerTransport).join(...a)};   // (hook de test)

  c.fillStyle=P.skinD;R(40,64,16,27);c.fillStyle='rgba(0,0,0,.26)';R(40,73,16,8);

// ============ Codec (dialogues façon Metal Gear) et radio en mission ============
// Briefings et débriefings : plein écran, deux portraits face à face, texte qui s'écrit. En mission : une bande radio discrète, sans pause.
const CX={on:false,lines:[],i:0,full:'',pos:0,left:'rook',right:'hale',speaker:'rook',mouth:false,done:null};
const RD={q:[],cur:null,full:'',pos:0,hold:0,mouth:false};
const CONTACT={hale:'140.85',marsh:'141.12'};
const isSquad=w=>w==='rook'||w==='lyra';
function blitPort(cid,id,open){const c=$(cid).getContext('2d');c.clearRect(0,0,96,112);c.drawImage(portrait(id,open),0,0)}
function cxDraw(){blitPort('cxL',CX.left,CX.speaker===CX.left&&CX.mouth);blitPort('cxR',CX.right,CX.speaker===CX.right&&CX.mouth)}
function cxShow(){
  const L=CX.lines[CX.i];
  if(isSquad(L[0]))CX.left=L[0];else CX.right=L[0];
  CX.speaker=L[0];CX.full=T('c.'+L[1]);CX.pos=0;CX.mouth=false;
  $('cxText').textContent='';$('cxNext').classList.remove('on');
  $('cxLn').textContent=T('n.'+CX.left);$('cxRn').textContent=T('n.'+CX.right);
  $('cxWho').textContent=T('n.'+L[0]);$('cxFreq').textContent=CONTACT[CX.right]||'140.85';
  $('cxSideL').classList.toggle('talk',CX.speaker===CX.left);$('cxSideR').classList.toggle('talk',CX.speaker===CX.right);
  playSfx('codecCall');cxDraw();
}
function playCodec(lines,done){
  CX.lines=lines;CX.i=0;CX.done=done||null;CX.on=true;
  CX.left=lines.find(l=>isSquad(l[0]))?.[0]||'rook';CX.right=lines.find(l=>!isSquad(l[0]))?.[0]||'hale';
  $('codec').classList.add('on');cxShow();
}
function cxAdvance(){
  if(!CX.on)return;
  if(CX.pos<CX.full.length){CX.pos=CX.full.length;CX.mouth=false;$('cxText').textContent=CX.full;$('cxNext').classList.add('on');cxDraw();return}
  CX.i++;
  if(CX.i>=CX.lines.length)cxEnd();else cxShow();
}
function cxEnd(silent){
  if(!CX.on)return;
  CX.on=false;$('codec').classList.remove('on');
  const d=CX.done;CX.done=null;if(!silent&&d)d();
}
function codecKey(e){
  if(e.repeat)return;
  const k=e.key.toLowerCase();
  if(CINE.on){if(k==='escape'||k==='enter'||k===' '){cineStop();e.preventDefault()}return}
  if(k==='escape'){cxEnd();e.preventDefault()}
  else if(k==='enter'||k===' '||k==='e'||k==='arrowright'){cxAdvance();e.preventDefault()}
}
function radioShow(w,k){RD.q.push({w,k});if(!RD.cur)rdNext()}
function radio(w,k){ev({k:'rd',w,s:k});radioShow(w,k)}   // hôte : montre ici et prévient l'invité
function rdNext(){
  const n=RD.q.shift();
  if(!n){RD.cur=null;$('radio').classList.remove('on');return}
  RD.cur=n;RD.full=T('c.'+n.k);RD.pos=0;RD.hold=0;
  $('rdWho').textContent=T('n.'+n.w);$('radio').classList.add('on');playSfx('codecCall');
}
function rdTick(){
  if(!RD.cur)return;
  if(RD.pos<RD.full.length){RD.pos++;RD.mouth=!RD.mouth;$('rdText').textContent=RD.full.slice(0,RD.pos);if(RD.pos%3===0)playSfx('blip')}
  else{RD.mouth=false;RD.hold+=30;if(RD.hold>1900+RD.full.length*28)rdNext()}
  if(!RD.cur)return;   // la réplique vient de se terminer et la file est vide
  const c=$('rdP').getContext('2d');c.clearRect(0,0,96,112);c.drawImage(portrait(RD.cur.w,RD.mouth),0,0);
}
setInterval(()=>{
  if(CX.on){
    if(CX.pos<CX.full.length){
      CX.pos++;CX.mouth=!CX.mouth;$('cxText').textContent=CX.full.slice(0,CX.pos);
      if(CX.pos%3===0)playSfx('blip');
      if(CX.pos>=CX.full.length){CX.mouth=false;$('cxNext').classList.add('on')}
    }
    cxDraw();
  }
  rdTick();
},30);
$('codec').addEventListener('pointerdown',e=>{if(e.target.closest('#cxSkip'))return;cxAdvance();e.preventDefault()});
$('cxSkip').onclick=()=>cxEnd();
for(let i=0;i<10;i++){const b=document.createElement('i');b.style.animationDelay=(i*.07)+'s';b.style.animationDuration=(.35+(i*37%10)/25)+'s';$('cxBars').appendChild(b)}

const CINE={on:false,t0:0,done:null,raf:0,bus:null,subs:-1,stars:[],blobs:[]};

function playCine(done){
  const rn=rng(3);
  CINE.stars=Array.from({length:240},()=>({x:rn(),y:rn(),z:.3+rn()*1.7,b:rn()}));
  CINE.blobs=Array.from({length:44},(_,i)=>{const ty=i%5;return{lo:rn()*6.28,la:ty===3?(rn()<.5?-1:1)*(1.0+rn()*.35):(rn()-.45)*1.7,r:.05+rn()*.09,ty}});
  CINE.on=true;CINE.done=done||null;CINE.t0=performance.now();CINE.subs=-1;
  $('cine').classList.add('on');$('cineMission').textContent=T('m.1.t').toUpperCase();
  $('cineC').width=innerWidth;$('cineC').height=innerHeight;
  cineAudio();

function cineLoop(now){

  cineDraw(cvs.getContext('2d'),cvs.width,cvs.height,t);
  let si=-1;CINE_SUBS.forEach((s,i)=>{if(t>=s[0]&&t<s[1])si=i});
  if(si!==CINE.subs){CINE.subs=si;const el=$('cineSub');if(si<0)el.classList.remove('on');else{el.textContent=T(CINE_SUBS[si][2]);el.classList.add('on')}}

// ============ Campagne : missions, progression, rangs ============
// Rang d'une mission : OR = aucune mort, ARGENT = 3 morts au plus (les deux joueurs cumulés), BRONZE = au-delà.
const CAMP={on:false,id:0,s:{},shown:false,rt:0};
const MISSIONS=[
  {id:1,world:'kappa',day:1,mode:'nests'},{id:2,world:'kappa',day:1,mode:'relay'},
  {id:3,world:'vesper',day:0},{id:4,world:'vesper',day:0},{id:5,world:'vesper',day:1},{id:6,world:'vesper',day:0},
  {id:7,world:'canyon',day:1},{id:8,world:'canyon',day:0},{id:9,world:'givre',day:1},{id:10,world:'givre',day:0},

const PLAYABLE=2;   // missions déjà jouables ; les suivantes s'affichent « Bientôt »
const PROG={intro:0,best:{}};
try{const p=JSON.parse(localStorage.getItem('nb_prog')||'null');if(p&&typeof p==='object'){PROG.intro=p.intro|0;PROG.best=p.best||{}}}catch(e){}
const saveProg=()=>{try{localStorage.setItem('nb_prog',JSON.stringify(PROG))}catch(e){}};
const GRANK={bronze:1,silver:2,gold:3};
const gradeOf=d=>d<=0?'gold':d<=3?'silver':'bronze';
const unlocked=id=>id<=PLAYABLE&&(id===1||!!PROG.best[id-1]||params.get('unlock')==='1');   // une mission s'ouvre quand la précédente est réussie ; ?unlock=1 ouvre tout (tests)
const fmtTime=t=>{t=Math.max(0,Math.floor(t));return (t/60|0)+':'+String(t%60).padStart(2,'0')};
const SCRIPT={   // [qui parle, clé du texte] : briefing avant la mission, débriefing après
  1:{brief:[['hale','b1.1'],['rook','b1.2'],['lyra','b1.3'],['hale','b1.4']],debrief:[['lyra','d1.1'],['hale','d1.2'],['rook','d1.3'],['hale','d1.4']]},
  2:{brief:[['lyra','b2.1'],['rook','b2.2'],['hale','b2.3'],['rook','b2.4']],debrief:[['marsh','d2.1'],['rook','d2.2'],['marsh','d2.3'],['hale','d2.4'],['lyra','d2.5'],['rook','d2.6']]},
};
function missionTick(){   // répliques radio scriptées (hôte / solo seulement : l'invité les reçoit par événement)
  const S=CAMP.s;
  if(CAMP.id===1){
    const dn=nests.filter(n=>n.dead).length;
    if(!S.a&&time>3){S.a=1;radio('lyra','r1.start')}
    if(S.pc&&dn>=1&&!S.b){S.b=1;radio('lyra','r1.one')}
    if(S.pc&&dn>=2&&!S.c){ // après le deuxième nid : des brutes gardent le dernier
      S.c=1;radio('rook','r1.two');
      const ln=nests.find(n=>!n.dead);
      if(ln)for(let i=0;i<2;i++)spawnAlien('brute',ln.x+(Math.random()-.5)*70,ln.y+(Math.random()-.5)*70);
    }
  }else if(CAMP.id===2&&relay){
    const p=relay.prog/RELAY_TIME;
    if(!S.a&&time>2.5){S.a=1;radio('lyra','r2.start')}
    if(p>=.25&&!S.b){S.b=1;radio('rook','r2.q1')}
    if(p>=.5&&!S.c){S.c=1;radio('lyra','r2.half')}
    if(relay.prog>=RELAY_TIME-60&&!S.d){S.d=1;radio('hale','r2.q3');callHeli(humans()[0]||player)}   // il reste une minute : renfort par hélicoptère
    if(relay.hp>0&&relay.hp<relay.maxhp*.4&&!S.e){S.e=1;radio('lyra','r2.low')}
  }
}

let pendingCamp=0;   // mission choisie en attendant qu'un partenaire se connecte
function abortCinematics(){cxEnd(true);cineStop(true);RD.q=[];RD.cur=null;$('radio').classList.remove('on')}
function runCine(id,intro,done){ // introduction (si demandée) puis briefing, puis done()
  const S=SCRIPT[id],brief=()=>S?playCodec(S.brief,done):done();
  if(intro)playCine(()=>{PROG.intro=1;saveProg();brief()});else brief();
}
function beginCampaign(id,opts){ // solo ou hôte : prépare la mission et prévient l'invité
  opts=opts||{};
  const m=MISSIONS[id-1];
  abortCinematics();hideResult();
  CAMP.on=true;CAMP.id=id;CAMP.shown=false;
  MODE=m.mode;setDay(m.day);setWorld(m.world);
  init();
  menuEl.style.display='none';running=false;paused=false;$('pause').style.display='none';
  const hostConn=NET.mode==='host'&&!!NET.conn;
  NET.guestReady=!hostConn;   // en ligne, la simulation attend que l'invité ait fini son briefing
  const intro=!opts.skip&&(opts.intro!==undefined?opts.intro:(id===1&&!PROG.intro));
  if(hostConn)netSend({t:'start',mode:MODE,world:WORLD.id,day:DAY?1:0,design:DESIGN.p1,camp:id,skip:opts.skip?1:0,intro:intro?1:0});
  if(opts.skip){startGame();return}
  runCine(id,intro,startGame);
}
const simHold=()=>CAMP.on&&NET.mode==='host'&&!!NET.conn&&!NET.guestReady;

function hideResult(){clearTimeout(CAMP.rt);$('result').classList.remove('on')}

    $('rMedal').style.display='';$('rMedalWrap').style.display=win?'block':'none';$('rMedal').className='medal big '+gr;$('rGrade').textContent=T('g.'+gr);$('rGrade').className='g-'+gr;
    $('rStats').textContent=T('r.deaths')+' : '+deaths+'   ·   '+T('r.time')+' : '+fmtTime(time);
    $('rNew').textContent=win&&rec?T('r.record'):'';
  }else{ // partie simple : un score (temps restant à la reine, état du réacteur en survie, sinon temps tenu)

    else if(win&&MODE==='survive'&&reactor){label=T('r.reactorLeft');val=Math.max(0,reactor.hp|0)+' / '+reactor.maxhp}
    else{label=T('r.held');val=fmtTime(time)}
    $('rTitle').textContent=T('msg.'+msgText);$('rSub').textContent=label;
    $('rMedal').style.display='none';$('rMedalWrap').style.display='block';$('rGrade').textContent=val;$('rGrade').className=win?'g-gold':'';

    $('rNew').textContent='';
  }
  $('rScale').style.display=camp&&win?'block':'none';
  $('rDebrief').style.display=camp&&win?'block':'none';
  $('rRetry').style.display=guest?'none':'block';$('rMissions').style.display=camp&&!guest?'block':'none';
  $('rQuit').style.display=guest||!camp?'block':'none';$('rWait').textContent=guest?T('r.waitHost'):'';
  $('result').classList.add('on');
}
function afterMission(){ // fin du débriefing (ou on saute) : l'hôte choisit la suite, l'invité attend
  if(NET.mode==='guest')toGuestWait();
  else{if(NET.mode==='host'&&NET.conn)netSend({t:'gwait'});toMissionSelect()}
}
$('rDebrief').onclick=()=>{hideResult();const S=SCRIPT[CAMP.id];S?playCodec(S.debrief,afterMission):afterMission()};
$('rRetry').onclick=()=>{if(NET.mode!=='guest')restart()};
$('rMissions').onclick=afterMission;
$('rQuit').onclick=()=>toMenu();
function toMissionSelect(){
  running=false;paused=false;$('pause').style.display='none';abortCinematics();hideResult();CAMP.on=false;
  if(NET.mode==='solo')bgScene();
  menuEl.style.display='flex';buildMissions();showScreen('s-missions');
}
function toGuestWait(){
  running=false;paused=false;$('pause').style.display='none';abortCinematics();hideResult();CAMP.on=false;
  menuEl.style.display='flex';showScreen('s-gwait');
}

// ---- écran de sélection des missions ----
function buildMissions(){
  const wrap=$('mlist');wrap.innerHTML='';
  MISSIONS.forEach(m=>{
    const open=unlocked(m.id),soon=m.id>PLAYABLE,best=PROG.best[m.id];
    const b=document.createElement('button');b.className='mrow';b.disabled=!open;
    const sub=T('w.'+m.world+'.n')+' · '+T(m.day?'c.day':'c.night')+' · '+T('m.'+m.id+'.y');
    b.innerHTML='<span class="mn">'+m.id+'</span><span class="mt"><b>'+T('m.'+m.id+'.t')+'</b><i>'+sub+'</i></span>'+
      (soon?'<em>'+T('c.soon')+'</em>':!open?'<em>'+T('c.locked')+'</em>':'<span class="medal '+(best||'none')+'" title="'+(best?T('c.best')+' : '+T('g.'+best):'')+'"></span>');
    b.onclick=()=>pickMission(m.id);
    wrap.appendChild(b);
  });
}
function openMissions(ctx){setupCtx=ctx;buildMissions();showScreen('s-missions')}
function pickMission(id){
  if(!unlocked(id))return;
  if(setupCtx==='host'&&!NET.conn){pendingCamp=id;hostGame();return}   // en ligne : d'abord le code, la mission démarre à la connexion
  beginCampaign(id,{});
}
$('bCampSolo').onclick=()=>openMissions('solo');
$('bCampHost').onclick=()=>openMissions('host');
$('bMBack').onclick=()=>{if(NET.conn)toMenu();else showScreen(setupCtx==='solo'?'s-solo':'s-create')};
$('bIntro').onclick=()=>{menuEl.style.display='none';playCine(()=>{PROG.intro=1;saveProg();menuEl.style.display='flex'})};
$('bGQuit').onclick=()=>toMenu();

// ---- choix du design du joueur 1 (le joueur 2 reçoit l'autre) ----
function buildDesigns(){
  document.querySelectorAll('.designs').forEach(wrap=>{
    wrap.innerHTML='';
    for(const gd of ['m','f']){
      const b=document.createElement('button');b.className='card dsg'+(DESIGN.p1===gd?' sel':'');
      const cvs=document.createElement('canvas');cvs.width=96;cvs.height=112;cvs.getContext('2d').drawImage(portrait('rook',false,gd==='f'),0,0);
      b.appendChild(cvs);b.setAttribute('aria-label','Rook');
      b.onclick=()=>{DESIGN.p1=gd;try{localStorage.setItem('nb_design',gd)}catch(e){}buildDesigns()};
      wrap.appendChild(b);
    }
  });
}

// ---- langue ----
function applyLang(){
  document.documentElement.lang=LANG;
  $('keys').dataset.i18nHtml=TOUCH.on?'keysTouch':'keysPC';
  document.querySelectorAll('[data-i18n]').forEach(e=>{e.textContent=T(e.dataset.i18n)});
  document.querySelectorAll('[data-i18n-html]').forEach(e=>{e.innerHTML=T(e.dataset.i18nHtml)});
  document.querySelectorAll('[data-i18n-ph]').forEach(e=>{e.placeholder=T(e.dataset.i18nPh)});
  $('mLang').textContent=LANG.toUpperCase();
  updateMuteUI();buildSetup();buildMissions();buildDesigns();
}
$('mLang').onclick=()=>{LANG=LANG==='fr'?'en':'fr';try{localStorage.setItem('nb_lang',LANG)}catch(e){}applyLang()};

function tintCanvas(c,col,a){if(!a)return;const x=c.getContext('2d');x.save();x.globalCompositeOperation='source-atop';x.globalAlpha=a;x.fillStyle=col;x.fillRect(0,0,c.width,c.height);x.restore()}
function setWorld(id){ // change de monde : graine de la carte + teinte des tuiles
  WORLD=WORLDS.find(w=>w.id===id)||WORLDS[0];
  makeTiles();
  const t=WORLD.tint;
  if(t)for(const k of ['ground','grass','rock','water'])for(const c of spr[k])tintCanvas(c,t[k][0],t[k][1]);
  mmT=1e9;
}
function showScreen(id,msg){
  document.querySelectorAll('#menu .screen').forEach(e=>e.classList.toggle('on',e.id===id));
  setStatus(msg);
}
function startGame(){menuEl.style.display='none';running=true;paused=false;document.getElementById('pause').style.display='none';if(NET.mode!=='guest')time=0}
const dropPeer=()=>{try{peer&&peer.destroy()}catch(e){}peer=null};
function loadDesign(){try{const d=localStorage.getItem('nb_design');DESIGN.p1=d==='f'?'f':'m'}catch(e){DESIGN.p1='m'}}
function bgScene(){CAMP.on=false;setDay(false);setWorld('kappa');MODE='queen';NET.mode='solo';init()}   // décor du titre : le nid
function toMenu(msg){
  running=false;paused=false;document.getElementById('pause').style.display='none';
  abortCinematics();hideResult();CAMP.on=false;pendingCamp=0;loadDesign();
  try{NET.conn&&NET.conn.close()}catch(e){}
  dropPeer();NET.conn=null;
  bgScene();
  menuEl.style.display='flex';showScreen('s-main',msg);
}
document.querySelectorAll('#menu [data-go]').forEach(b=>b.onclick=()=>showScreen(b.dataset.go));
function buildSetup(){
  const wrap=$('worlds');wrap.innerHTML='';
  WORLDS.forEach((w,i)=>{
    const b=document.createElement('button');b.className='card'+(i===sel.world?' sel':'');
    b.innerHTML='<div class="sw">'+w.sw.map(c=>'<i style="background:'+c+'"></i>').join('')+'</div><b>'+T('w.'+w.id+'.n')+'</b><span>'+T('w.'+w.id+'.d')+'</span>';
    b.onclick=()=>{sel.world=i;buildSetup()};
    wrap.appendChild(b);
  });
  document.querySelectorAll('#modeOpts .opt').forEach(o=>o.classList.toggle('sel',o.dataset.mode===sel.mode));
  document.querySelectorAll('#dayOpts .opt').forEach(o=>o.classList.toggle('sel',+o.dataset.day===sel.day));
  $('bLaunch').textContent=T(setupCtx==='solo'?'launch':'hostCreate');
}
document.querySelectorAll('#modeOpts .opt').forEach(o=>o.onclick=()=>{sel.mode=o.dataset.mode;buildSetup()});
document.querySelectorAll('#dayOpts .opt').forEach(o=>o.onclick=()=>{sel.day=+o.dataset.day;buildSetup()});
function openSetup(ctx){setupCtx=ctx;buildSetup();showScreen('s-setup')}
$('bSimple').onclick=()=>openSetup('solo');
$('bCreateSimple').onclick=()=>openSetup('host');
$('bSetupBack').onclick=()=>showScreen(setupCtx==='solo'?'s-solo':'s-create');
$('bLaunch').onclick=()=>{
  setWorld(WORLDS[sel.world].id);MODE=sel.mode;setDay(sel.day);CAMP.on=false;pendingCamp=0;
  if(setupCtx==='solo'){dropPeer();NET.mode='solo';init();startGame()}
  else hostGame();
};
function hostGame(){ // partie en ligne : on attend qu'un partenaire se connecte avec le code
  dropPeer();showScreen('s-host');$('hostCode').textContent='…';setStatus(T('net.creating'));
  TRANSPORT.host(
    code=>{$('hostCode').textContent=code;setStatus(T('net.waiting'))},
    conn=>{
      NET.conn=conn;NET.mode='host';
      conn.onmsg=onHostMsg;conn.onclose=onHostClose;
      NET.snapT=0;
      if(pendingCamp){const id=pendingCamp;pendingCamp=0;beginCampaign(id,{});return}   // campagne : briefing des deux côtés puis départ
      init();
      conn.send({t:'start',mode:MODE,world:WORLD.id,day:DAY?1:0,design:DESIGN.p1});
      startGame();
    },
    err=>setStatus(T('net.err',err)));
}
$('bCancelHost').onclick=()=>{dropPeer();pendingCamp=0;showScreen('s-create')};
// toucher / cliquer le code de la partie le copie dans le presse-papiers (pour l'envoyer à l'autre joueur)
function copyText(t){
  if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(t);
  return new Promise((ok,ko)=>{   // repli (page non sécurisée, anciens navigateurs)
    const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');
    ta.style.cssText='position:fixed;left:-999px;top:0;opacity:0';document.body.appendChild(ta);
    ta.select();ta.setSelectionRange(0,t.length);
    let r=false;try{r=document.execCommand('copy')}catch(e){}
    ta.remove();r?ok():ko(new Error('copy refused'));
  });
}
let copyT=0;
function copyHostCode(){
  const el=$('hostCode'),code=el.textContent.trim();
  if(!/^[A-Z0-9]{5}$/.test(code))return;   // le code n'est pas encore là
  clearTimeout(copyT);
  copyText(code).then(()=>{
    el.classList.add('copied');$('copyHint').textContent=T('net.copied');playSfx('pickup');
  }).catch(()=>{$('copyHint').textContent=T('net.copyFail',code)});
  copyT=setTimeout(()=>{el.classList.remove('copied');$('copyHint').textContent=T('copyHint')},2200);
}
$('hostCode').addEventListener('click',copyHostCode);
$('hostCode').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();copyHostCode()}});
$('bJoin').onclick=()=>{
  const code=$('code').value.trim().toUpperCase();
  if(!code){setStatus(T('net.enterCode'));return}
  dropPeer();setStatus(T('net.connecting'));
  TRANSPORT.join(code,
    conn=>{
      NET.conn=conn;NET.mode='guest';
      conn.onmsg=onGuestMsg;conn.onclose=onGuestClose;
      setStatus(T('net.connected'));
    },
    err=>setStatus(T('net.err',err)));
};
{ // via l'URL : ?join=CODE ouvre directement « Rejoindre » ; ?mode=survive présélectionne le mode
  const j=params.get('join');
  if(j){$('code').value=j.toUpperCase();showScreen('s-join')}
}
bgScene();   // décor du titre

// ============ Commandes tactiles (mobile) ============
// Joystick gauche = se déplacer, joystick droit = orienter, boutons : TIRER, GRENADE, E (porte / ordres).
const TOUCH={on:matchMedia('(pointer:coarse)').matches||params.get('touch')==='1',mx:0,my:0,aim:-0.8,aimTarget:-0.8,aimSet:false,fire:false,t:-1e9};
addEventListener('touchstart',()=>{TOUCH.t=performance.now()},{passive:true});
function press(id,down,up){
  const el=$(id);
  el.addEventListener('pointerdown',e=>{try{el.setPointerCapture(e.pointerId)}catch(_){}down();e.preventDefault()});
  const end=()=>{if(up)up()};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}
function dynStick(zoneId,baseId,onMove,onEnd){
  const zone=$(zoneId),base=$(baseId),knob=base.querySelector('i'),HALF=62,R=50;
  let pid=null,ox=0,oy=0;
  const place=()=>{
    ox=Math.max(HALF,Math.min(innerWidth-HALF,ox));oy=Math.max(HALF,Math.min(innerHeight-HALF,oy));
    base.style.left=(ox-HALF)+'px';base.style.top=(oy-HALF)+'px';
  };
  zone.addEventListener('pointerdown',e=>{
    if(pid!==null)return;pid=e.pointerId;try{zone.setPointerCapture(pid)}catch(_){}
    ox=e.clientX;oy=e.clientY;
    base.style.right='auto';base.style.bottom='auto';base.style.opacity='1';place();
    knob.style.transform='';onMove(0,0);e.preventDefault();
  });
  zone.addEventListener('pointermove',e=>{
    if(e.pointerId!==pid)return;
    let dx=e.clientX-ox,dy=e.clientY-oy;const d=Math.hypot(dx,dy);
    if(d>R){const k=(d-R)/d;ox+=dx*k;oy+=dy*k;place();dx=e.clientX-ox;dy=e.clientY-oy}   // le socle suit le doigt
    knob.style.transform='translate('+dx+'px,'+dy+'px)';
    onMove(dx/R,dy/R);
  });
  const end=e=>{
    if(e.pointerId!==pid)return;pid=null;
    base.removeAttribute('style');knob.style.transform='';onEnd();   // le socle retourne à sa place de repos
  };
  zone.addEventListener('pointerup',end);zone.addEventListener('pointercancel',end);
}
dynStick('zoneL','stickL',(x,y)=>{
  const m=Math.hypot(x,y);
  if(m<.15){TOUCH.mx=0;TOUCH.my=0}
  else{const k=Math.min(1,(m-.15)/.6)/m;TOUCH.mx=x*k;TOUCH.my=y*k}   // zone morte + vitesse proportionnelle
},()=>{TOUCH.mx=0;TOUCH.my=0});
dynStick('zoneR','stickR',(x,y)=>{if(Math.hypot(x,y)>.3){TOUCH.aimTarget=Math.atan2(y,x);TOUCH.aimSet=true}},()=>{});
press('tFire',()=>{TOUCH.fire=true},()=>{TOUCH.fire=false});
press('tE',()=>{if(running)interact()});
press('tG',()=>{if(running){if(NET.mode==='guest')netSend({t:'g'});else throwGrenade(player)}});
press('tMenu',()=>togglePause());
press('tRestart',()=>{if(running&&over&&NET.mode!=='guest'&&!CAMP.on)restart()});
addEventListener('blur',()=>{TOUCH.fire=false;TOUCH.mx=0;TOUCH.my=0});
function touchUI(){
  if(!TOUCH.on)return;
  $('touch').style.display=running?'block':'none';
  $('tRestart').style.display='none';   // le résultat a ses propres boutons
}

// ---- son : premier geste = démarrage de l'audio (les navigateurs l'exigent) ----
['pointerdown','keydown','touchend','click'].forEach(n=>addEventListener(n,audioInit,true));
$('mMute').onclick=()=>{audioInit();setMute(!AUD.muted)};
press('tMute',()=>{audioInit();setMute(!AUD.muted)});
menuEl.addEventListener('click',e=>{if(e.target.closest('button')&&e.target.id!=='mMute')playSfx('ui')});
updateMuteUI();

// ---- menu pause : réglages du son, reprendre, quitter ----
function togglePause(force){
  if(!running)return;
  paused=force!==undefined?force:!paused;
  $('pause').style.display=paused?'flex':'none';
  if(paused){
    mouse.down=false;TOUCH.fire=false;TOUCH.mx=0;TOUCH.my=0;
    const solo=NET.mode==='solo';
    $('pauseTitle').textContent=T(solo?'pause':'menu');
    $('pauseNote').textContent=T(solo?'pauseSolo':'pauseNet');
  }
}
function syncVolUI(){
  $('volMus').value=Math.round(VOL.mus*100);$('volMusV').textContent=Math.round(VOL.mus*100)+'%';
  $('volSfx').value=Math.round(VOL.sfx*100);$('volSfxV').textContent=Math.round(VOL.sfx*100)+'%';
}
function saveVol(){try{localStorage.setItem('nb_vol_mus',VOL.mus);localStorage.setItem('nb_vol_sfx',VOL.sfx)}catch(e){}}
$('volMus').addEventListener('input',e=>{VOL.mus=e.target.value/100;$('volMusV').textContent=e.target.value+'%';saveVol();applyVolumes()});
$('volSfx').addEventListener('input',e=>{VOL.sfx=e.target.value/100;$('volSfxV').textContent=e.target.value+'%';saveVol();applyVolumes()});
$('volSfx').addEventListener('change',()=>playSfx('pickup'));   // aperçu du volume des effets
$('pMute').onclick=()=>{audioInit();setMute(!AUD.muted)};
$('pResume').onclick=()=>togglePause(false);
$('pQuit').onclick=()=>toMenu();
syncVolUI();

// ============ Boucle ============
applyLang();
init();
cam.x=player.x-cv.width/2;cam.y=player.y-cv.height/2;
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(NET.mode==='guest')updateGuest(dt);
  else{
    if(!running)time+=dt;
    const frozen=paused&&NET.mode==='solo';   // pause : seulement en solo, en ligne la partie continue
    if(running&&!over&&!frozen&&!simHold())update(dt);else if(!frozen){fx.forEach(e=>e.t-=dt);fx=fx.filter(e=>e.t>0);updateParts(dt)}
    if(NET.mode==='host')netHostTick(dt);
  }
  if(running&&over&&!CAMP.shown){CAMP.shown=true;CAMP.rt=setTimeout(showResult,1500)}   // résultat de mission après la scène finale
  touchUI();
  audioTick(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
