<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Nidus Breach</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  html,body{margin:0;height:100%;background:#05070a;color:#cfe;font:14px monospace;overflow:hidden}
  canvas{display:block;width:100%;height:100%;cursor:none}
  #menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 60%,rgba(6,9,18,.5),rgba(2,3,8,.9));font-family:'Segoe UI',system-ui,sans-serif;z-index:10;overflow:auto}
  #menu .box{width:min(460px,calc(100vw - 28px));margin:14px;padding:22px 24px 18px;border-radius:16px;background:rgba(10,15,28,.86);border:1px solid rgba(140,170,220,.28);box-shadow:0 24px 70px rgba(0,0,0,.65),0 0 60px rgba(150,60,200,.12);text-align:center;backdrop-filter:blur(3px)}
  #menu .box{position:relative}
  #menu .logo{margin-top:22px}   /* laisse la place au bouton Son en haut à droite */
  #menu button.mute{position:absolute;top:10px;right:10px;width:auto;margin:0;padding:6px 10px;font-size:11px;letter-spacing:1px;font-weight:600;background:transparent;border-color:rgba(140,170,220,.3);color:#9fb2d6}
  #menu .logo{font-weight:800;font-size:clamp(32px,9vw,48px);letter-spacing:7px;line-height:1;background:linear-gradient(180deg,#e8ffd0,#8fe05a 45%,#b04cd8);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(160,70,210,.55))}
  #menu .logo span{display:block;font-size:.62em;letter-spacing:15px;margin-top:6px;padding-left:15px}
  #menu .tag{color:#8fa3c8;font-size:13px;letter-spacing:3px;margin:10px 0 18px;text-transform:uppercase}
  #menu h2{margin:2px 0 14px;font-size:15px;letter-spacing:3px;color:#c8d6f0;text-transform:uppercase;font-weight:700}
  #menu .screen{display:none}
  #menu .screen.on{display:block}
  #menu button{display:block;width:100%;margin:9px 0;padding:13px;border-radius:9px;border:1px solid #3d5486;background:linear-gradient(180deg,#2a3a5e,#1e2b48);color:#eaf1ff;font:700 15px 'Segoe UI',system-ui,sans-serif;letter-spacing:1px;cursor:pointer}
  #menu button:hover:not(:disabled){background:linear-gradient(180deg,#36497a,#273659);border-color:#6a86c8}
  #menu button:disabled{opacity:.45;cursor:not-allowed}
  #menu button small{font-weight:600;font-size:11px;letter-spacing:2px;color:#ffd27a;margin-left:8px;text-transform:uppercase}
  #menu button.ghost{background:transparent;border-color:rgba(140,170,220,.3);color:#9fb2d6;font-weight:600;padding:9px}
  #menu .lbl{margin:14px 0 6px;font-size:11px;letter-spacing:2px;color:#7e90b3;text-transform:uppercase;text-align:left}
  #menu .worlds{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  #menu button.card{margin:0;padding:9px 10px;text-align:left;letter-spacing:0;font-weight:600;background:#142036;border-color:rgba(140,170,220,.25)}
  #menu button.card b{display:block;font-size:13px;color:#eaf1ff;margin:6px 0 3px}
  #menu button.card span{display:block;font-size:11px;font-weight:400;color:#9fb2d6;line-height:1.35}
  #menu button.card .sw{display:flex;height:8px;border-radius:4px;overflow:hidden}
  #menu button.card .sw i{flex:1}
  #menu button.sel{border-color:#8fe05a;box-shadow:0 0 0 1px #8fe05a inset,0 0 14px rgba(143,224,90,.25)}
  #menu .modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  #menu button.opt{margin:0;padding:11px 8px;font-size:13px}
  #menu .code{cursor:pointer;display:inline-block;padding:4px 14px;border-radius:10px;border:1px dashed rgba(255,226,138,.35);transition:background .15s,border-color .15s;-webkit-tap-highlight-color:transparent}
  #menu .code:hover{background:rgba(255,226,138,.08);border-color:rgba(255,226,138,.7)}
  #menu .code.copied{background:rgba(143,224,90,.18);border-color:#8fe05a;color:#c8ffa8}
  #menu .copyhint{color:#7e90b3;font-size:11.5px;letter-spacing:1px;margin-bottom:8px;min-height:15px}
  #menu .code{font:800 34px monospace;letter-spacing:10px;color:#ffe28a;margin:6px 0 4px;text-shadow:0 0 14px rgba(255,200,80,.4)}
  #menu .hint{color:#8fa3c8;font-size:13px;margin-bottom:10px}
  #menu .row{display:flex;gap:8px;margin:8px 0}
  #menu .row input{flex:1;min-width:0;padding:11px;border-radius:9px;border:1px solid #3d5486;background:#0c1220;color:#e8f0ff;font:700 18px monospace;letter-spacing:6px;text-align:center;text-transform:uppercase}
  #menu .row button{width:auto;margin:0;padding:11px 18px}
  #status{min-height:20px;margin-top:8px;color:#ffd27a;font-size:13px}
  #menu .keys{margin-top:12px;color:#6f81a4;font-size:11.5px;line-height:1.55}
  html,body{touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #menu input{-webkit-user-select:text;user-select:text}
  #touch{position:fixed;inset:0;display:none;pointer-events:none;z-index:5;touch-action:none}
  #touch .stick{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));width:124px;height:124px;border-radius:50%;background:rgba(160,190,255,.12);border:2px solid rgba(180,205,255,.35);pointer-events:auto;touch-action:none}
  #touch .stick i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(200,220,255,.35);border:2px solid rgba(220,235,255,.6)}
  #stickL{left:max(14px,env(safe-area-inset-left))}
  #stickR{right:max(14px,env(safe-area-inset-right))}
  #touch #stickR,#touch #stickL{pointer-events:none;opacity:.45;transition:opacity .15s}
  #zoneR{position:absolute;right:0;bottom:0;width:52%;height:62%;pointer-events:auto;touch-action:none}
  #zoneL{position:absolute;left:0;bottom:0;width:48%;height:62%;pointer-events:auto;touch-action:none}
  #touch .tbtn{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:rgba(20,30,50,.55);color:#fff;font:800 12px 'Segoe UI',system-ui,sans-serif;letter-spacing:1px;padding:0}
  #touch .tbtn:active{background:rgba(255,255,255,.3)}
  #tFire{width:78px;height:78px;right:max(150px,calc(env(safe-area-inset-right) + 150px));bottom:max(24px,env(safe-area-inset-bottom));background:rgba(220,70,50,.5);border-color:rgba(255,160,140,.75);font-size:14px}
  #tE{width:54px;height:54px;right:max(22px,env(safe-area-inset-right));bottom:158px;font-size:19px}
  #tG{width:54px;height:54px;right:calc(max(22px,env(safe-area-inset-right)) + 64px);bottom:158px;font-size:11px}
  #tMute{width:40px;height:40px;left:calc(max(18px,env(safe-area-inset-left) + 18px) + 50px);bottom:152px;font-size:17px;border-radius:11px}
  #tMenu{width:40px;height:40px;left:max(18px,calc(env(safe-area-inset-left) + 18px));bottom:152px;font-size:17px;border-radius:11px}
  #tRestart{display:none;border-radius:12px;left:50%;top:60%;transform:translateX(-50%);padding:14px 28px;font-size:16px;width:auto;height:auto;background:rgba(60,110,60,.7)}
  #pause{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(2,4,10,.62);font-family:'Segoe UI',system-ui,sans-serif;z-index:11;overflow:auto;-webkit-user-select:none;user-select:none}
  #pause .box{width:min(380px,calc(100vw - 28px));margin:14px;padding:20px 24px 16px;border-radius:16px;background:rgba(10,15,28,.94);border:1px solid rgba(140,170,220,.3);box-shadow:0 24px 70px rgba(0,0,0,.65);text-align:center}
  #pause h2{margin:2px 0 6px;font-size:20px;letter-spacing:6px;color:#e8f0ff;font-weight:800}
  #pause .note{color:#ffd27a;font-size:12.5px;min-height:18px;margin-bottom:10px}
  #pause .lbl{margin:12px 0 4px;font-size:11px;letter-spacing:2px;color:#7e90b3;text-transform:uppercase;text-align:left;display:flex;justify-content:space-between}
  #pause input[type=range]{width:100%;accent-color:#8fe05a;margin:2px 0 4px;height:28px}
  #pause button{display:block;width:100%;margin:9px 0;padding:13px;border-radius:9px;border:1px solid #3d5486;background:linear-gradient(180deg,#2a3a5e,#1e2b48);color:#eaf1ff;font:700 15px 'Segoe UI',system-ui,sans-serif;letter-spacing:1px;cursor:pointer}
  #pause button:hover{background:linear-gradient(180deg,#36497a,#273659);border-color:#6a86c8}
  #pause button.small{padding:9px;font-size:13px;font-weight:600;background:transparent;border-color:rgba(140,170,220,.3);color:#b8c8e8}
  #pause button.ghost{background:transparent;border-color:rgba(255,130,130,.4);color:#ff9d9d;font-weight:600;padding:10px}
  /* --- langue, design du soldat, campagne --- */
  #menu button.lang{left:10px;right:auto}
  #menu .designs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  #menu button.dsg{text-align:center;padding:8px;margin:0}
  #menu button.dsg canvas{display:block;margin:0 auto;width:86px;height:100px;image-rendering:pixelated;border:1px solid rgba(140,170,220,.3);border-radius:3px}
  #menu button.dsg b{font-size:13px;color:#eaf1ff}
  #menu .mlist{display:flex;flex-direction:column;gap:6px;max-height:min(50vh,430px);overflow:auto;margin-bottom:6px;padding-right:2px;text-align:left}
  #menu button.mrow{display:flex;align-items:center;gap:10px;margin:0;padding:8px 10px;text-align:left;letter-spacing:0;font-weight:600;background:#142036;border-color:rgba(140,170,220,.25)}
  #menu button.mrow .mn{flex:none;width:26px;height:26px;border-radius:50%;background:#26365a;display:grid;place-items:center;font-size:13px}
  #menu button.mrow .mt{flex:1;min-width:0}
  #menu button.mrow b{display:block;font-size:14px;color:#eaf1ff}
  #menu button.mrow i{display:block;font-style:normal;font-weight:400;font-size:11px;color:#9fb2d6;margin-top:2px}
  #menu button.mrow em{font-style:normal;font-size:11px;letter-spacing:1px;color:#ffd27a;text-transform:uppercase}
  .medal{width:22px;height:22px;flex:none;border-radius:50%;box-sizing:border-box;border:2px solid rgba(0,0,0,.35);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25);display:inline-block}
  .medal.gold{background:radial-gradient(circle at 35% 30%,#fff3b0,#ffd23a 55%,#b88a00)}
  .medal.silver{background:radial-gradient(circle at 35% 30%,#fff,#dfe6f0 55%,#8e9aab)}
  .medal.bronze{background:radial-gradient(circle at 35% 30%,#ffd9b0,#d98a4a 55%,#8a4a1a)}
  .medal.none{background:transparent;border:2px dashed rgba(140,170,220,.3);box-shadow:none}
  .medal.big{width:84px;height:84px;border-width:4px}
  /* --- codec (dialogues) --- */
  #codec{position:fixed;inset:0;display:none;flex-direction:column;z-index:20;background:radial-gradient(ellipse at 50% 40%,#0a2a24 0%,#04120f 55%,#010605 100%);color:#9dffd8;font-family:'Courier New',monospace;cursor:pointer;-webkit-user-select:none;user-select:none}
  #codec.on{display:flex}
  #codec::after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.3) 0 1px,transparent 1px 3px)}
  .cx-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;font-size:12px;letter-spacing:3px;border-bottom:1px solid rgba(110,255,200,.25)}
  .cx-top #cxHint{opacity:.55;letter-spacing:1px;font-size:11px}
  #cxSkip,#cineSkip{position:relative;z-index:2;padding:6px 12px;border-radius:6px;border:1px solid rgba(110,255,200,.45);background:rgba(2,30,24,.8);color:#9dffd8;font:600 12px 'Courier New',monospace;letter-spacing:1px;cursor:pointer}
  .cx-stage{flex:1;display:flex;align-items:center;justify-content:center;gap:clamp(8px,3vw,44px);padding:10px;min-height:0}
  .cx-side{display:flex;flex-direction:column;align-items:center;gap:6px;transition:filter .2s;filter:brightness(.42) saturate(.45)}
  .cx-side.talk{filter:none}
  .cx-side canvas{width:min(32vw,215px,34vh);height:auto;aspect-ratio:96/112;image-rendering:pixelated;border:2px solid rgba(110,255,200,.55);box-shadow:0 0 18px rgba(80,255,190,.25);background:#000}
  .cx-name{font-size:12px;letter-spacing:2px;min-height:15px;text-align:center}
  .cx-mid{text-align:center;flex:none}
  .cx-freq{font-size:clamp(18px,4.5vw,38px);letter-spacing:4px;text-shadow:0 0 12px #3fe}
  .cx-bars{display:flex;gap:3px;justify-content:center;height:24px;align-items:flex-end;margin-top:8px}
  .cx-bars i{width:4px;background:#7fffd0;height:25%;animation:cxb .4s infinite alternate}
  @keyframes cxb{to{height:100%}}
  .cx-box{position:relative;margin:0 auto 18px;width:min(780px,94vw);box-sizing:border-box;border:2px solid rgba(110,255,200,.5);background:rgba(2,20,16,.88);padding:12px 16px;box-shadow:0 0 22px rgba(80,255,190,.18);min-height:104px}
  .cx-who{font-size:12px;letter-spacing:3px;color:#ffe28a;margin-bottom:6px}
  .cx-text{font-size:clamp(14px,2.3vw,18px);line-height:1.5;min-height:4.5em;color:#bfffe6}
  .cx-next{position:absolute;right:12px;bottom:6px;opacity:0}
  .cx-next.on{opacity:1;animation:cxk 1s steps(2) infinite}
  @keyframes cxk{50%{opacity:.15}}
  /* --- radio en mission --- */
  #radio{position:fixed;left:50%;bottom:78px;transform:translate(-50%,20px);width:min(580px,94vw);box-sizing:border-box;display:flex;gap:10px;padding:8px 10px;background:rgba(2,20,16,.9);border:1px solid rgba(110,255,200,.55);box-shadow:0 0 16px rgba(80,255,190,.2);color:#bfffe6;font:13px 'Courier New',monospace;z-index:8;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
  #radio.on{opacity:1;transform:translate(-50%,0)}
  #radio canvas{width:54px;height:63px;image-rendering:pixelated;border:1px solid rgba(110,255,200,.5);flex:none;background:#000}
  #radio .rdbody{flex:1;min-width:0}
  #rdWho{font-size:11px;letter-spacing:2px;color:#ffe28a;margin-bottom:3px}
  #rdText{line-height:1.4;min-height:2.8em}
  /* --- introduction --- */
  #cine{position:fixed;inset:0;display:none;z-index:21;background:#000;cursor:pointer}
  #cine.on{display:block}
  #cineC{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
  #cineSkip{position:absolute;right:14px;bottom:14px}
  #cineSub{position:absolute;left:50%;bottom:12%;transform:translateX(-50%);width:min(840px,90vw);text-align:center;color:#eaf1ff;font:italic 600 clamp(14px,2.3vw,21px) 'Segoe UI',system-ui,sans-serif;text-shadow:0 2px 8px #000,0 0 3px #000;opacity:0;transition:opacity .7s;pointer-events:none}
  #cineSub.on{opacity:1}
  #cineTitle{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;opacity:0;transition:opacity 1s;pointer-events:none;text-align:center}
  #cineTitle.on{opacity:1}
  #cineTitle b{font:800 clamp(30px,8vw,64px)/1 'Segoe UI',system-ui,sans-serif;letter-spacing:.2em;background:linear-gradient(180deg,#e8ffd0,#8fe05a 45%,#b04cd8);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(160,70,210,.55))}
  #cineTitle span{font:600 clamp(12px,2.4vw,18px) 'Segoe UI',system-ui,sans-serif;letter-spacing:.35em;color:#a8b8d8}
  /* --- résultat de mission --- */
  #result{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:12;background:rgba(2,4,10,.72);font-family:'Segoe UI',system-ui,sans-serif;overflow:auto}
  #result.on{display:flex}
  #result .rbox{width:min(400px,calc(100vw - 28px));margin:14px;padding:20px 24px 16px;border-radius:16px;background:rgba(10,15,28,.95);border:1px solid rgba(140,170,220,.3);box-shadow:0 24px 70px rgba(0,0,0,.65);text-align:center;color:#cfe}
  #result h2{margin:0 0 4px;font-size:20px;letter-spacing:4px;font-weight:800}
  #result h2.win{color:#9dffb0}#result h2.fail{color:#ff8a7a}
  #result .rsub{color:#8fa3c8;font-size:13px;letter-spacing:2px;text-transform:uppercase;margin-bottom:12px}
  #result .medal.big{margin:4px auto 6px;display:block}
  #rGrade{font-weight:800;font-size:22px;letter-spacing:6px;margin-bottom:8px}
  #rGrade.g-gold{color:#ffd23a}#rGrade.g-silver{color:#dfe6f0}#rGrade.g-bronze{color:#d98a4a}
  #result .rstats{font-size:13px;color:#cfe;margin-bottom:4px}
  #result .rnew{min-height:18px;color:#ffe28a;font-size:13px;font-weight:700;letter-spacing:1px}
  #result .rscale{font-size:11px;color:#7e90b3;margin:4px 0 8px}
  #result button{display:block;width:100%;margin:8px 0;padding:12px;border-radius:9px;border:1px solid #3d5486;background:linear-gradient(180deg,#2a3a5e,#1e2b48);color:#eaf1ff;font:700 15px 'Segoe UI',system-ui,sans-serif;letter-spacing:1px;cursor:pointer}
  #result button:hover{background:linear-gradient(180deg,#36497a,#273659);border-color:#6a86c8}
  #result button.ghost{background:transparent;border-color:rgba(140,170,220,.3);color:#9fb2d6;font-weight:600;padding:9px}
  #result .rwait{color:#ffd27a;font-size:13px;min-height:18px;margin-top:6px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="menu"><div class="box">
  <div class="logo">NIDUS<span>BREACH</span></div>
  <button class="mute lang" id="mLang">FR</button>
  <button class="mute" id="mMute">Son : activé</button>
  <div class="tag" data-i18n="tag">Brisez le nid</div>

  <div class="screen on" id="s-main">
    <button data-go="s-solo" data-i18n="solo">Solo</button>
    <button data-go="s-multi" data-i18n="multi">Multi</button>
  </div>

  <div class="screen" id="s-solo">
    <h2 data-i18n="solo">Solo</h2>
    <div class="lbl" data-i18n="designLbl">Ton soldat</div>
    <div class="designs"></div>
    <button id="bCampSolo" data-i18n="campaign" style="margin-top:14px">Campagne</button>
    <button id="bSimple" data-i18n="simple">Partie simple</button>
    <button class="ghost" data-go="s-main" data-i18n="back">Retour</button>
  </div>

  <div class="screen" id="s-multi">
    <h2 data-i18n="multi">Multi</h2>
    <button data-go="s-create" data-i18n="createGame">Créer une partie</button>
    <button data-go="s-join" data-i18n="joinGame">Rejoindre une partie</button>
    <button class="ghost" data-go="s-main" data-i18n="back">Retour</button>
  </div>

  <div class="screen" id="s-create">
    <h2 data-i18n="createGame">Créer une partie</h2>
    <div class="lbl" data-i18n="designLbl">Ton soldat</div>
    <div class="designs"></div>
    <div class="hint" data-i18n="designHint" style="margin-top:6px;font-size:11.5px"></div>
    <button id="bCampHost" data-i18n="campaign">Campagne</button>
    <button id="bCreateSimple" data-i18n="simple">Partie simple</button>
    <button class="ghost" data-go="s-multi" data-i18n="back">Retour</button>
  </div>

  <div class="screen" id="s-missions">
    <h2 data-i18n="c.title">Campagne</h2>
    <div class="mlist" id="mlist"></div>
    <button class="ghost" id="bIntro" data-i18n="c.intro">Revoir l'introduction</button>
    <button class="ghost" id="bMBack" data-i18n="back">Retour</button>
  </div>

  <div class="screen" id="s-gwait">
    <h2 data-i18n="g.waitTitle">En attente</h2>
    <div class="hint" data-i18n="g.wait"></div>
    <button class="ghost" id="bGQuit" data-i18n="r.quit">Quitter</button>
  </div>

  <div class="screen" id="s-setup">
    <h2 data-i18n="simple">Partie simple</h2>
    <div class="lbl" data-i18n="world">Monde</div>
    <div class="worlds" id="worlds"></div>
    <div class="lbl" data-i18n="modeLbl">Mode de jeu</div>
    <div class="modes" id="modeOpts">
      <button class="opt" data-mode="survive" data-i18n-html="survive">Survie</button>
      <button class="opt" data-mode="queen" data-i18n-html="queenMode">Chasse à la reine</button>
    </div>
    <div class="lbl" data-i18n="dayLbl">Moment de la journée</div>
    <div class="modes" id="dayOpts">
      <button class="opt" data-day="0" data-i18n-html="night">Nuit</button>
      <button class="opt" data-day="1" data-i18n-html="day">Jour</button>
    </div>
    <button id="bLaunch" style="margin-top:16px">Lancer la partie</button>
    <button class="ghost" id="bSetupBack" data-i18n="back">Retour</button>

// ============ Toujours la dernière version ============
// Le navigateur ou l'hébergeur (GitHub Pages garde les pages ~10 min) peut servir une ancienne copie.
// Au chargement, on récupère la page sans cache et on compare son script avec celui qui tourne : s'il diffère, on recharge
// via une adresse neuve (?v=...), ce qui force la version à jour. Garde-fou : au plus un rechargement toutes les 20 s.
async function checkForUpdate(){
  try{
    if(!/^https?:$/.test(location.protocol))return;                 // en fichier local, rien à vérifier
    const norm=t=>t.replace(/\r\n?/g,'\n');
    const mine=norm(document.querySelector('script:not([src])').textContent);
    const res=await fetch(location.pathname+'?nocache='+Date.now(),{cache:'no-store'});
    if(!res.ok)return;
    const txt=norm(await res.text()),i=txt.indexOf('<script>'),j=txt.lastIndexOf('<'+'/script>');
    if(i<0||j<i||txt.slice(i+8,j)===mine)return;
    const last=+sessionStorage.getItem('nb_upd')||0;
    if(Date.now()-last<20000)return;
    sessionStorage.setItem('nb_upd',Date.now());
    const u=new URLSearchParams(location.search);u.set('v',Date.now());
    location.replace(location.pathname+'?'+u+location.hash);
  }catch(e){}
}
checkForUpdate();

function genMap(){
  const rand = rng(WORLD.seed);
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++) map[y][x]= rand()<WORLD.grass?1:0;
  for(let i=0;i<WORLD.blobs;i++){
    const cx=rand()*MW|0, cy=rand()*MH|0, r=1+rand()*3|0, t=rand()<WORLD.rock?2:3;
    for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++)
      if(x*x+y*y<=r*r+rand()*2){const X=cx+x,Y=cy+y; if(X>0&&Y>0&&X<MW-1&&Y<MH-1) map[Y][X]=t;}
  }
  for(let x=0;x<MW;x++){map[0][x]=map[MH-1][x]=2}
  for(let y=0;y<MH;y++){map[y][0]=map[y][MW-1]=2}
  // corridors garantis
  const carve=(x,y)=>{for(let d=-1;d<=1;d++)for(let e=-1;e<=1;e++){const X=x+d,Y=y+e;if(X>0&&Y>0&&X<MW-1&&Y<MH-1&&(map[Y][X]>=2))map[Y][X]=0}};
  for(let i=0;i<MW;i++) carve(i,Math.round(MH/2+Math.sin(i/7)*5));
  for(let y=MH/2|0;y<FORT.y1;y++) carve(FORT.x1+4,y);
  for(let y=NEST.y;y<MH/2+2;y++) carve(NEST.x-2,y);
  // forteresse : zone dégagée + murs avec 2 portes
  for(let y=FORT.y0-1;y<=FORT.y1+1;y++)for(let x=FORT.x0-1;x<=FORT.x1+1;x++) map[y][x]=0;
  for(let x=FORT.x0;x<=FORT.x1;x++){map[FORT.y0][x]=2;map[FORT.y1][x]=2}
  for(let y=FORT.y0;y<=FORT.y1;y++){map[y][FORT.x0]=2;map[y][FORT.x1]=2}
  const gx=(FORT.x0+FORT.x1)>>1, gy=(FORT.y0+FORT.y1)>>1;
  map[FORT.y0][gx]=map[FORT.y0][gx+1]=7;                 // porte nord (ouverte)
  map[gy][FORT.x1]=map[gy+1][FORT.x1]=7;                 // porte est (ouverte)
  for(let x=FORT.x1+1;x<=FORT.x1+4;x++){map[gy][x]=0;map[gy+1][x]=0}
  for(let y=FORT.y0-4;y<FORT.y0;y++){map[y][gx]=0;map[y][gx+1]=0}
  // nid de la reine (reine / survie). En campagne : pas de repaire, mais des nids à détruire (mission 1) ou un relais à tenir (mission 2)
  const lair=MODE==='queen'||MODE==='survive';
  if(lair)for(let y=-6;y<=6;y++)for(let x=-6;x<=6;x++) if(x*x+y*y<=36) map[NEST.y+y][NEST.x+x]=0;
  holes=lair?[[NEST.x-4,NEST.y+3],[NEST.x+3,NEST.y+4],[NEST.x+4,NEST.y-3],[NEST.x-3,NEST.y-4]]:[];
  if(MODE==='survive') holes.push([MW-5,MH/2|0],[MW/2|0,4],[MW/2|0,MH-5]);
  if(MODE==='relay') holes.push([MW-5,MH/2|0],[MW/2|0,4],[MW-6,8]);   // les aliens arrivent de loin
  if(MODE==='relay'||MODE==='nests'){   // enceinte de l'antenne : murs, une porte vers la base et une au nord (fermées en mission 1)
    const rgy=(FORT.y0+FORT.y1)>>1;
    for(let x=FORT.x1+1;x<YARD.x0;x++){map[rgy][x]=0;map[rgy+1][x]=0}   // chemin depuis la porte est de la base
    for(let y=YARD.y0-1;y<=YARD.y1+1;y++)for(let x=YARD.x0-1;x<=YARD.x1+1;x++)map[y][x]=0;
    for(let x=YARD.x0;x<=YARD.x1;x++){map[YARD.y0][x]=2;map[YARD.y1][x]=2}
    for(let y=YARD.y0;y<=YARD.y1;y++){map[y][YARD.x0]=2;map[y][YARD.x1]=2}
    map[rgy][YARD.x0]=map[rgy+1][YARD.x0]=MODE==='relay'?7:6;           // porte ouest (en mission 2 on est déjà passé)
    map[YARD.y0][RELAY.tx]=map[YARD.y0][RELAY.tx+1]=6;                  // porte nord
    for(let y=YARD.y0-4;y<YARD.y0;y++){map[y][RELAY.tx]=0;map[y][RELAY.tx+1]=0}
  }
  for(const [x,y] of holes){ for(let d=-1;d<=1;d++)for(let e=-1;e<=1;e++){const X=x+d,Y=y+e;if(map[Y]&&map[Y][X]!==undefined&&map[Y][X]>=2)map[Y][X]=0}; map[y][x]=4; }
  // tourelles de la base : près des deux portes, à l'intérieur de la forteresse
  const tgx=(FORT.x0+FORT.x1)>>1, tgy=(FORT.y0+FORT.y1)>>1;
  turretSpots=[[tgx-2,FORT.y0],[tgx+3,FORT.y0],[FORT.x1,tgy-2],[FORT.x1,tgy+3]];   // intégrées à la ligne des murs, de part et d'autre des portes
  turretSpots.forEach(([x,y])=>{map[y][x]=8});
  // nids pondeurs : petits dômes bruns répartis sur la carte (graine propre -> identiques chez l'invité)
  {
    const nr=rng(WORLD.seed*7+13),want=MODE==='relay'?0:MODE==='nests'?3:MODE==='survive'?7:9,fcx=(FORT.x0+FORT.x1)/2,fcy=(FORT.y0+FORT.y1)/2;nests=[];
    for(let tr=0;tr<800&&nests.length<want;tr++){
      const tx=3+(nr()*(MW-6)|0),ty=3+(nr()*(MH-6)|0);
      const far=MODE==='nests';   // mission 1 : nids loin de la base, de l'antenne et les uns des autres
      if(Math.hypot(tx-fcx,ty-fcy)<(far?26:20)||Math.hypot(tx-NEST.x,ty-NEST.y)<12||holes.some(h=>Math.hypot(h[0]-tx,h[1]-ty)<6))continue;
      if(far&&Math.hypot(tx-RELAY.tx,ty-RELAY.ty)<16)continue;
      if(nests.some(n=>Math.hypot(n.tx-tx,n.ty-ty)<(far?(tr<500?24:17):13)))continue;
      nests.push({id:nests.length,tx,ty,x:tx*TS+TS/2,y:ty*TS+TS/2,r:15,hp:110,maxhp:110,hurt:0,t:4+nr()*10,dead:false});
    }
    for(const n of nests)for(let y=-2;y<=2;y++)for(let x=-2;x<=2;x++)if(x*x+y*y<=5){const X=n.tx+x,Y=n.ty+y;if(X>0&&Y>0&&X<MW-1&&Y<MH-1)map[Y][X]=0}
  }
  // points de vie des murs (-1 = indestructible)
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    const t=map[y][x],border=x===0||y===0||x===MW-1||y===MH-1;
    let hp=0;
    if(t===2)hp=border?-1:((x>=FORT.x0&&x<=FORT.x1&&y>=FORT.y0&&y<=FORT.y1)||inYard(x,y))?120:60;
    else if(t===3)hp=-1;
    else if(t===6||t===7)hp=150;
    else if(t===8)hp=130;
    thp[y*MW+x]=thpMax[y*MW+x]=hp;
  }
}

let fieldDirty=false;
const solidT=(tx,ty)=>tx<0||ty<0||tx>=MW||ty>=MH||map[ty][tx]===2||map[ty][tx]===3||map[ty][tx]===6||map[ty][tx]===8;
function damageTile(tx,ty,dmg){
  if(!solidT(tx,ty)||tx<=0||ty<=0||tx>=MW-1||ty>=MH-1)return;
  const k=ty*MW+tx;if(thp[k]<0)return;
  thp[k]-=dmg;dirtyT.add(k);

    const wasT=map[ty][tx]===8;map[ty][tx]=0;fieldDirty=true;snd(wasT?'boom':'crumble',tx*TS+TS/2,ty*TS+TS/2);
    if(wasT){const cx=tx*TS+TS/2,cy=ty*TS+TS/2;pushFx({x:cx,y:cy,t:.4,t0:.4,r:48,c:'#fa4',boom:true});burst(cx,cy,22,'#ffb040',260,.7,3);burst(cx,cy,6,'#444',50,1.5,11,true);scorch(cx,cy,34);pushText({x:cx,y:cy-18,t:1.6,k:'tx.turretDown',c:'#ff9966'})}
    burst(tx*TS+TS/2,ty*TS+TS/2,16,'#9a9588',150,.8,3.5);burst(tx*TS+TS/2,ty*TS+TS/2,4,'#777',40,1,9,true);
  }
}
function doorGroup(x0,y0){
  const grp=[],seen=new Set(),st=[[x0,y0]];
  while(st.length){
    const [x,y]=st.pop(),k=y*MW+x;if(seen.has(k))continue;seen.add(k);
    const t=map[y]&&map[y][x];if(t!==6&&t!==7)continue;
    grp.push([x,y]);st.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
  }
  return grp;
}
const setDoors=(grp,open)=>{grp.forEach(([x,y])=>{map[y][x]=open?7:6;dirtyT.add(y*MW+x)});fieldDirty=true};
function hitsWall(x,y,r){
  const x0=Math.floor((x-r)/TS),x1=Math.floor((x+r)/TS),y0=Math.floor((y-r)/TS),y1=Math.floor((y+r)/TS);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(solidT(tx,ty))return true;
  return false;
}
function los(ax,ay,bx,by){
  const d=Math.hypot(bx-ax,by-ay),n=Math.ceil(d/10);
  for(let i=1;i<n;i++){const t=i/n;if(solidT(Math.floor((ax+(bx-ax)*t)/TS),Math.floor((ay+(by-ay)*t)/TS)))return false}
  return true;
}
function tryMove(e,dx,dy){
  if(!hitsWall(e.x+dx,e.y,e.r))e.x+=dx;
  if(!hitsWall(e.x,e.y+dy,e.r))e.y+=dy;
}

// ============ Champs de navigation (BFS) ============
// coût d'une case (-1 = infranchissable). Les aliens peuvent percer murs et portes (coût élevé),
// les alliés ouvrent les portes mais ne cassent pas les murs.
function cfAlien(x,y){
  if(x<0||y<0||x>=MW||y>=MH)return -1;
  const t=map[y][x];
  if(t===2)return thp[y*MW+x]<0?-1:12;
  if(t===3)return -1;
  return t===6||t===8?12:1;
}
function cfAlly(x,y){
  if(x<0||y<0||x>=MW||y>=MH)return -1;
  const t=map[y][x];
  return t===2||t===3||t===6||t===8?-1:1;   // les alliés n'ouvrent pas les portes fermées
}
function flow(sx,sy,cf){ // Dijkstra à seaux
  const f=new Int32Array(MW*MH).fill(-1),s=sy*MW+sx,b=[[s]];f[s]=0;
  for(let d=0;d<b.length;d++){
    const q=b[d];if(!q)continue;
    for(let i=0;i<q.length;i++){
      const k=q[i];if(f[k]!==d)continue;
      const x=k%MW,y=k/MW|0;
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const nx=x+dx,ny=y+dy,c=cf(nx,ny);if(c<0)continue;
        const nk=ny*MW+nx,nd=d+c;
        if(f[nk]<0||nd<f[nk]){f[nk]=nd;(b[nd]||(b[nd]=[])).push(nk)}
      }
    }
  }
  return f;
}
function descend(f,e,speed,dt){
  const tx=Math.floor(e.x/TS),ty=Math.floor(e.y/TS);let best=f[ty*MW+tx],bx=tx,by=ty;
  if(best<0)best=1e9;
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    if(!dx&&!dy)continue;const nx=tx+dx,ny=ty+dy;if(nx<0||ny<0||nx>=MW||ny>=MH)continue;
    if(dx&&dy&&(solidT(tx+dx,ty)||solidT(tx,ty+dy)))continue;
    const v=f[ny*MW+nx];if(v>=0&&v<best){best=v;bx=nx;by=ny}
  }
  e.brk=solidT(bx,by)?{tx:bx,ty:by}:null;   // case à détruire pour avancer
  const gx=bx*TS+TS/2,gy=by*TS+TS/2,a=Math.atan2(gy-e.y,gx-e.x);
  tryMove(e,Math.cos(a)*speed*dt,Math.sin(a)*speed*dt);
  return a;
}

function nearestAlly(maxD,p=player){let b=null,bd=maxD;for(const a of allies)if(a.hp>0&&!a.lt){const d=dist(a,p);if(d<bd){bd=d;b=a}}return b}   // Lyra (IA) n'obéit pas aux ordres : elle suit toujours

function giveOrder(p=player){ // E : ordre suivant pour tous les alliés dans la zone

  group.forEach(a=>a.order=next);snd('order',p.x,p.y);

function explode(x,y,R,dmg){
  snd('boom',x,y);scorch(x,y,R*.9);burst(x,y,26,'#ffb040',320,.7,3);burst(x,y,8,'#555',60,1.4,10,true);

  for(const e of aliens){

    if(e.hp>0&&d<R+e.r){e.hp-=dmg*(1-.6*d/(R+e.r));e.hurt=.12}
  }
  for(const n of nests){const d=Math.hypot(n.x-x,n.y-y);if(!n.dead&&d<R+n.r){n.hp-=dmg*(1-.6*d/(R+n.r));n.hurt=.12}}

}

function fireWeapon(p){

function usePC(p){ // le journal de la colonie : les nids se réveillent et une première vague tombe sur l'escouade
  CAMP.s.pc=1;fieldDirty=true;snd('pickup',p.x,p.y);

  const place=(cx,cy,r0,r1)=>{for(let k=0;k<20;k++){const a=Math.random()*6.28,r=r0+Math.random()*(r1-r0),x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;if(!hitsWall(x,y,10)){spawnAlien('scout',x,y);return}}};
  for(const h of humans())for(let i=0;i<4;i++)place(h.x,h.y,250,340);

function tryDoor(p=player){ // E près d'une porte : ouvre / ferme ; près d'alliés : change leur ordre
  if(!p||over||p.hp<=0)return;
  if(p.mech){ejectMech(p,false);return}
  if(term&&!CAMP.s.pc&&dist(term,p)<56){usePC(p);return}   // mission 1 : le terminal révèle l'origine du silence radio
  const px=Math.floor(p.x/TS),py=Math.floor(p.y/TS);let best=null,bd=44;
  for(let ty=py-2;ty<=py+2;ty++)for(let tx=px-2;tx<=px+2;tx++){
    const t=map[ty]&&map[ty][tx];if(t!==6&&t!==7)continue;
    const cx=tx*TS+TS/2,cy=ty*TS+TS/2,d=Math.hypot(cx-p.x,cy-p.y);
    let da=Math.atan2(cy-p.y,cx-p.x)-p.face;da=Math.atan2(Math.sin(da),Math.cos(da));
    if(d<bd&&(Math.abs(da)<.8||d<26)){bd=d;best=[tx,ty]}
  }
  const ally=nearestAlly(ORDER_RANGE,p);   // alliés dans la zone, sinon la porte
  const mm=mechas.find(m=>dist(m,p)<54);
  if(mm&&(!best||dist(mm,p)<=bd)){boardMech(p,mm);return}   // le mécha est prioritaire sur les ordres (les alliés se pressent autour de la base)
  if(ally&&(!best||dist(ally,p)<bd)){giveOrder(p);return}
  if(!best)return;
  const opening=map[best[1]][best[0]]===6,grp=doorGroup(best[0],best[1]);
  if(!opening){
    for(const [x,y] of grp)for(const s of [...soldiers(),...aliens])
      if(Math.abs(x*TS+TS/2-s.x)<TS/2+s.r&&Math.abs(y*TS+TS/2-s.y)<TS/2+s.r){pushText({x:p.x,y:p.y-20,t:.8,k:'tx.doorBlocked',c:'#f96'});return}
  }
  setDoors(grp,opening);snd('door',p.x,p.y);
  pushText({x:p.x,y:p.y-20,t:.8,k:opening?'tx.doorOpen':'tx.doorClosed',c:'#9cf'});
}

function spawnLt(x,y){ // Lyra en solo : lieutenant IA, nous suit et tire, revient à la base quelques secondes après sa chute

function scatterSurvivors(){ // mission 1 : des soldats isolés dans la colonie, ils nous rejoignent quand on s'approche

    if(Math.hypot(tx-(FORT.x0+FORT.x1)/2,ty-(FORT.y0+FORT.y1)/2)<14||inYard(tx,ty)||hitsWall(x,y,14))continue;
    if(nests.some(nn=>Math.hypot(nn.tx-tx,nn.ty-ty)<9)||allies.some(a=>a.iso&&Math.hypot(a.x-x,a.y-y)<220))continue;

function spawnAlien(type,x,y){

function shoot(s,aim,dmg,team,spread,o){

}

// ============ Mise à jour ============
const keys={},mouse={x:0,y:0,down:false};
const cam={x:0,y:0};
function humanInput(p){ // entrée locale (clavier + souris, ou commandes tactiles) pour le soldat p
  if(paused)return {mx:0,my:0,aim:p.face,fire:false};   // menu ouvert : le soldat reste immobile
  let mx=(keys.d||keys.arrowright?1:0)-(keys.q||keys.a||keys.arrowleft?1:0),
      my=(keys.s||keys.arrowdown?1:0)-(keys.z||keys.w||keys.arrowup?1:0),
      aim=Math.atan2(mouse.y/Z+cam.y-p.y,mouse.x/Z+cam.x-p.x),fire=mouse.down;
  if(TOUCH.on){
    if(TOUCH.mx||TOUCH.my){mx=TOUCH.mx;my=TOUCH.my}
    if(!TOUCH.aimSet&&(mx||my))TOUCH.aim=Math.atan2(my,mx);   // tant qu'on n'a pas utilisé le joystick de visée : on regarde où l'on marche
    if(TOUCH.aimSet)TOUCH.aim=angLerp(TOUCH.aim,TOUCH.aimTarget,.4);
    aim=TOUCH.aim;fire=fire||TOUCH.fire;
  }
  return {mx,my,aim,fire};
}
function updateHuman(p,inp,dt){ // déplacement, tir, ramassages d'un joueur (local ou distant)
  if(p.hp>0){
    const l=Math.max(1,Math.hypot(inp.mx,inp.my)), sp=p.mech?(inp.fire?80:100):(inp.fire?95:125);
    tryMove(p,inp.mx/l*sp*dt,inp.my/l*sp*dt);
    p.face=inp.aim;
    p.cd-=dt;p.gcd-=dt;
    if(inp.fire&&p.cd<=0)fireWeapon(p);
    for(let i=bonuses.length-1;i>=0;i--){const b=bonuses[i];if((b.cool||0)>time)continue;if(dist(b,p)<22){pickBonus(b,p);bonuses.splice(i,1)}}
    // ramassage de munitions chez les frères d'armes tombés
    for(const c of corpses){
      if(c.ammo>0&&dist(c,p)<24){giveSmgUnits(p,c.ammo);c.ammo=0}
    }
    // armurerie de la base : pistolet -> mitraillette ; sinon recharge l'arme en main (stock limité qui se reconstitue)
    if(dist(armory,p)<48&&armory.stock>=1){
      if(p.weapon==='pistol'){if(armory.stock>=30){armory.stock-=30;equip(p,'smg',60)}}
      else{
        const W=WEAPONS[p.weapon],rc=Math.min(W.cap,W.pick*3);
        if(p.ammo<rc){armory.acc+=40*dt;const n=Math.min(armory.acc|0,armory.stock|0);if(n>0){p.ammo=Math.min(rc,p.ammo+n*W.pick/50);armory.stock-=n;armory.acc-=n}}
      }
    }
  }
  p.hurt-=dt;p.inv-=dt;
}
function update(dt){
  time+=dt;
  fieldTimer-=dt;
  if(fieldDirty){fieldDirty=false;refreshFields();fieldTimer=.35}
  else if(fieldTimer<=0){fieldTimer=.35;refreshPlayerFields()}
  armory.stock=Math.min(160,armory.stock+2*dt);

  // --- joueurs ---
  updateHuman(player,humanInput(player),dt);
  if(player2){
    const i2=NET.in2;
    if(time-i2.t>1.5){i2.mx=0;i2.my=0;i2.fire=false}   // plus d'entrées reçues : on lâche tout
    updateHuman(player2,i2,dt);
  }

  // --- alliés (IA basique, ordres : avancer / suivre / tenir) ---
  for(const a of allies){
    a.cd-=dt;a.hurt-=dt;a.inv-=dt;if(a.hp<=0)continue;
    if(a.iso){for(const h of humans())if(dist(h,a)<110){a.iso=false;a.order='follow';pushText({x:a.x,y:a.y-22,t:1.8,k:'tx.recruit',c:'#9f9'});snd('order',a.x,a.y);break}}   // un soldat isolé rejoint l'escouade
    let tgt=null,bd=330;
    for(const e of aliens)if(e.hp>0){const d=dist(a,e);if(d<bd&&los(a.x,a.y,e.x,e.y)){bd=d;tgt=e}}
    const h=nearestHuman(a),dp=dist(a,h),ord=a.order;
    const toPlayer=(sp)=>{ // rejoint le joueur (ligne droite si dégagé, sinon par le chemin)
      if(h.hp>0&&los(a.x,a.y,h.x,h.y)){const an=Math.atan2(h.y-a.y,h.x-a.x);tryMove(a,Math.cos(an)*sp*dt,Math.sin(an)*sp*dt);return an}
      return descend(h.ffield,a,sp,dt);
    };
    const guard=(MODE==='survive'||MODE==='relay')&&ord==='advance';   // en survie / au relais, l'ordre par défaut = garder la place
    const inFortNow=MODE==='relay'?dist(a,relay)<RELAY_ZONE*.8:inFort(Math.floor(a.x/TS),Math.floor(a.y/TS));
    if(tgt){
      a.face=Math.atan2(tgt.y-a.y,tgt.x-a.x);
      if(a.cd<=0){
        if(a.ammo>0){a.ammo--;a.cd=.42+Math.random()*.2;shoot(a,a.face,6,0,.34)}
        else{a.cd=1.05;shoot(a,a.face,6,0,.2)}   // plus de munitions : pistolet (lent, infini)
      }
      if(guard){if(!inFortNow)descend(fieldFort,a,80,dt)}
      else if(ord==='follow'){if(dp>150)toPlayer(95)}
      else if(ord==='advance'){
        if(bd>190&&aheadOK(a,h))tryMove(a,Math.cos(a.face)*30*dt,Math.sin(a.face)*30*dt);
      }
    }else if(guard){
      if(!inFortNow)a.face=descend(fieldFort,a,80,dt);
    }else if(ord==='follow'){
      if(dp>110)a.face=toPlayer(100);
    }else if(ord==='advance'&&aheadOK(a,h)){
      a.face=descend(fieldNest,a,34,dt);                           // progression lente vers le nid
    }
    a.walk+=dt*8;
  }
  // séparation alliés/joueurs
  const ss=soldiers();
  for(let i=0;i<ss.length;i++)for(let j=i+1;j<ss.length;j++){
    const a=ss[i],b=ss[j],dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy);
    if(l>0&&l<a.r+b.r){const p=(a.r+b.r-l)/2/l;tryMove(a,-dx*p,-dy*p);tryMove(b,dx*p,dy*p)}
  }

  // --- aliens ---
  const cand=ss.slice();if(reactor&&reactor.hp>0)cand.push(reactor);if(relay&&relay.hp>0&&!relay.static)cand.push(relay);   // ils s'en prennent aussi au réacteur / au relais
  for(const e of aliens){
    e.hurt-=dt;e.cd-=dt;e.wcd=(e.wcd||0)-dt;
    if(e.burn>0){e.burn-=dt;e.hp-=7*dt;if(Math.random()<dt*16)burst(e.x,e.y,1,'#ff8a2a',50,.35,3)}
    const d=ALIEN[e.type];
    // cible : tirée au hasard (pondérée par la proximité), conservée 1,5 à 3,5 s -> ils ne se jettent plus tous sur le même joueur
    e.tT=(e.tT||0)-dt;
    if(!e.tg||e.tg.hp<=0||e.tT<=0){
      e.tT=1.5+Math.random()*2;let tot=0;
      const ws=cand.map(s=>{const w=(s.isRelay?5:s.isReactor?.8:s.isPlayer?.55:1)/Math.pow(dist(e,s)+80,2);tot+=w;return w});
      let rv=Math.random()*tot;e.tg=cand[0];
      for(let i=0;i<cand.length;i++){rv-=ws[i];if(rv<=0){e.tg=cand[i];break}}
    }
    if(relay&&!relay.static&&relay.hp>0&&e.tg!==relay&&e.type!=='queen'&&dist(e,relay)<520&&los(e.x,e.y,relay.x,relay.y)){e.tg=relay;e.tT=3}   // dès qu'ils voient l'antenne, ils foncent la ronger
    const tgt=e.tg;if(!tgt)continue;
    const bd=dist(e,tgt);
    const seen=bd<(e.type==='queen'?430:300)&&los(e.x,e.y,tgt.x,tgt.y);
    if(e.type==='queen'){if(seen&&e.cd<=0){e.cd=2.2;snd('roar',e.x,e.y);spit(e,tgt,18)}continue}
    e.brk=null;
    if(e.type==='spitter'){
      if(seen){
        e.face=Math.atan2(tgt.y-e.y,tgt.x-e.x);
        if(bd>210)tryMove(e,Math.cos(e.face)*d.speed*dt,Math.sin(e.face)*d.speed*dt);
        else if(bd<130)tryMove(e,-Math.cos(e.face)*d.speed*.7*dt,-Math.sin(e.face)*d.speed*.7*dt);
        if(e.cd<=0){e.cd=d.cd;spit(e,tgt,14)}
      }else e.face=descend(fieldFor(tgt),e,d.speed*.95,dt);
    }else if(bd<260&&los(e.x,e.y,tgt.x,tgt.y)){
      e.face=Math.atan2(tgt.y-e.y,tgt.x-e.x);
      if(bd>e.r+tgt.r+2)tryMove(e,Math.cos(e.face)*d.speed*dt,Math.sin(e.face)*d.speed*dt);
    }else e.face=descend(fieldFor(tgt),e,d.speed*.95,dt);
    e.ph+=dt*d.speed/10;
    e.jt=(e.jt||0)-dt;if(e.jt<=0){e.jt=.5+Math.random()*1.2;e.jd=(Math.random()-.5)*2}   // trajectoire un peu aléatoire
    tryMove(e,-Math.sin(e.face)*e.jd*d.speed*.28*dt,Math.cos(e.face)*e.jd*d.speed*.28*dt);
    // les aliens rongent murs et portes qui leur barrent la route
    if(e.brk&&e.wcd<=0&&Math.hypot(e.brk.tx*TS+TS/2-e.x,e.brk.ty*TS+TS/2-e.y)<e.r+TS*.8){
      e.wcd=.8;damageTile(e.brk.tx,e.brk.ty,d.dmg*1.5);
    }
    if(e.wcd<=0)for(const t of turrets)  // ils s'en prennent aussi aux tourelles qu'ils frôlent
      if(map[t.ty][t.tx]===8&&Math.hypot(t.tx*TS+TS/2-e.x,t.ty*TS+TS/2-e.y)<e.r+TS*.8){e.wcd=.8;damageTile(t.tx,t.ty,d.dmg*1.2);break}
    if(e.type!=='spitter'&&bd<e.r+tgt.r+6&&e.cd<=0&&!((tgt.inv||0)>0)){   // courte invulnérabilité après un coup : un essaim ne fond plus un soldat en une seconde
      e.cd=d.cd;hurtS(tgt,d.dmg);tgt.hurt=.2;tgt.inv=tgt.isPlayer?.35:.4;snd('bite',tgt.x,tgt.y);burst(tgt.x,tgt.y,7,'#b01010',110,.5,2.6);decal(tgt.x,tgt.y,10,'#5a0a0a',.35);
      if(tgt.isPlayer)addShake(tgt,5);
    }
  }
  for(let i=0;i<aliens.length;i++)for(let j=i+1;j<aliens.length;j++){
    const a=aliens[i],b=aliens[j];if(a.type==='queen'||b.type==='queen')continue;
    const dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy),m=a.r+b.r;
    if(l>0&&l<m){const p=(m-l)/2/l;tryMove(a,-dx*p,-dy*p);tryMove(b,dx*p,dy*p)}
  }

  // --- tourelles : tirent sur les aliens en vue ---
  for(const t of turrets){
    if(map[t.ty][t.tx]!==8)continue;
    const cx=t.tx*TS+TS/2,cy=t.ty*TS+TS/2;t.cd-=dt;
    let tg=null,bd=320;
    for(const e of aliens)if(e.hp>0){
      const d=Math.hypot(e.x-cx,e.y-cy);
      if(d<bd){const a=Math.atan2(e.y-cy,e.x-cx);if(los(cx+Math.cos(a)*20,cy+Math.sin(a)*20,e.x,e.y)){bd=d;tg=e}}
    }
    if(tg){
      t.face=Math.atan2(tg.y-cy,tg.x-cx);
      if(t.cd<=0){

        else{burst(b.x,b.y,b.acid?6:4,b.acid?'#8f3':'#ffd890',b.acid?90:140,.25,2);if(b.acid)decal(b.x,b.y,8,'#5a9a20',.3);damageTile(btx,bty,b.acid?10:(map[bty][btx]===8?0:3))}

      if(b.team===0){

  allies=allies.filter(a=>!a.dead);
  if(ltT>0){ltT-=dt;if(ltT<=0){ltT=-1;spawnLt(BASE.x,BASE.y);pushFx({x:BASE.x+36,y:BASE.y+10,t:.5,t0:.5,r:34,c:'#cfe',boom:true})}}
  for(const e of aliens)if(e.hp<=0&&e.type!=='queen'){snd('dieA',e.x,e.y);if(bonuses.length<10){if(e.type==='brute'&&Math.random()<.25)addBonus(e.x,e.y);else if(Math.random()<(hs.some(lowOnAmmo)?.05:.02)&&ammoOnMap()<3)addBonus(e.x,e.y,'ammo')}burst(e.x,e.y,14,'#8fd02a',150,.6,3);decal(e.x,e.y,e.r*1.6,'#3f6a14',.5)}

    if(!h||h.hp>0)continue;
    if(!h.dead){
      h.dead=true;deaths++;h.mech=null;h.r=9;h.respT=RESP_TIME;decal(h.x,h.y,18,'#5a0a0a',.55);burst(h.x,h.y,12,'#9a1010',140,.6,3);corpses.push({x:h.x,y:h.y,ammo:0});
      if(h.weapon!=='pistol'&&h.ammo>=1)bonuses.push({x:h.x,y:h.y,type:h.weapon,t:0,ammo:Math.floor(h.ammo),cool:time+1.2});
      pushText({x:h.x,y:h.y-20,t:1.6,k:h===player?'tx.selfDown':'tx.partnerDown',c:'#f99'});
    }
    if(canRespawn()){h.respT-=dt;if(h.respT<=0)respawn(h)}
  }
  // --- nids : mort ---
  for(const n of nests){
    n.hurt-=dt;
    if(n.hp<=0&&!n.dead){
      n.dead=true;fieldDirty=true;snd('boom',n.x,n.y);scorch(n.x,n.y,26);burst(n.x,n.y,22,'#8a5a30',200,.7,4);burst(n.x,n.y,10,'#4a7a18',120,.6,3);decal(n.x,n.y,26,'#3f6a14',.5);
      pushFx({x:n.x,y:n.y,t:.3,t0:.3,r:50,c:'#fa4',boom:true});pushText({x:n.x,y:n.y-22,t:1.8,k:'tx.nestDown',c:'#fc6'});
      if(Math.random()<.25&&bonuses.length<10)addBonus(n.x,n.y);
    }
  }
  // --- réacteur (survie) ---
  if(reactor){
    reactor.hurt-=dt;reactor.alertT-=dt;
    if(reactor.hurt>0&&reactor.alertT<=0&&reactor.hp>0){reactor.alertT=6;pushText({x:reactor.x,y:reactor.y-34,t:1.6,k:'tx.reactorHit',c:'#7fd8ff'})}
    if(reactor.hp>0&&reactor.hp<reactor.maxhp*.4&&Math.random()<dt*6)burst(reactor.x+(Math.random()-.5)*20,reactor.y-6,1,'#555',30,.9,6,true);
    if(reactor.hp<=0&&!reactor.dead){
      reactor.dead=true;snd('boom',reactor.x,reactor.y);burst(reactor.x,reactor.y,30,'#7fd8ff',260,.8,4);burst(reactor.x,reactor.y,10,'#444',70,1.6,10,true);scorch(reactor.x,reactor.y,40);
      pushFx({x:reactor.x,y:reactor.y,t:.5,t0:.5,r:100,c:'#8cf',boom:true});pushText({x:reactor.x,y:reactor.y-40,t:3,k:'tx.reactorDown',c:'#ff7a7a'});
      for(const h of humans())addShake(h,10);
    }
  }

  // --- relais radio (mission 2) : il émet tant qu'un soldat est dans la zone ---
  if(relay){
    relay.hurt-=dt;relay.alertT-=dt;
    if(relay.hp>0){
      if(relay.hurt>0&&relay.alertT<=0){relay.alertT=6;pushText({x:relay.x,y:relay.y-56,t:1.6,k:'tx.relayHit',c:'#7fd8ff'})}
      if(relay.hp<relay.maxhp*.4&&Math.random()<dt*6)burst(relay.x+(Math.random()-.5)*20,relay.y-10,1,'#555',30,.9,6,true);
      if(!relay.static)relay.prog=Math.min(RELAY_TIME,relay.prog+dt);   // l'antenne émet tant qu'elle tient
    }else if(!relay.dead){
      relay.dead=true;snd('boom',relay.x,relay.y);burst(relay.x,relay.y,30,'#7fd8ff',260,.8,4);burst(relay.x,relay.y,10,'#444',70,1.6,10,true);scorch(relay.x,relay.y,40);
      pushFx({x:relay.x,y:relay.y,t:.5,t0:.5,r:100,c:'#8cf',boom:true});pushText({x:relay.x,y:relay.y-40,t:3,k:'tx.relayDown',c:'#ff7a7a'});
      for(const h of humans())addShake(h,10);
    }
  }
  if(CAMP.on&&!over)missionTick();

  // --- convoi (bronze) : les soldats arrivent un à un à la base ---
  for(const c of convoys){
    c.t-=dt;
    if(c.t<=0&&c.n>0){
      c.n--;c.t=.45;
      for(let k=0;k<12;k++){
        const x=BASE.x+(Math.random()-.5)*130,y=BASE.y+20+Math.random()*70;
        if(hitsWall(x,y,10)&&k<11)continue;
        const a=newSoldier(x,y,false);a.ammo=40;allies.push(a);
        pushFx({x,y,t:.35,t0:.35,r:26,c:'#cfe',boom:true});snd('thud',x,y);break;
      }
    }
  }
  convoys=convoys.filter(c=>c.n>0);
  // --- hélicoptères (argent) ---
  for(const h of helis){
    h.x+=h.vx*dt;h.t+=dt;h.cd-=dt;
    const past=(x)=>h.vx>0?h.x>=x:h.x<=x,ref=nearestHuman(h);
    if(!h.dropped&&(past(ref.x)||past(h.endX-h.vx*.4))){h.dropped=true;dropNear(h.x,h.y+30,3);pushText({x:h.x,y:h.y+10,t:1.6,k:'tx.drop',c:'#dfe6f0'})}
    if(h.cd<=0){
      let tg=null,bd=380;for(const e of aliens)if(e.hp>0){const d=Math.hypot(e.x-h.x,e.y-h.y);if(d<bd){bd=d;tg=e}}
      if(tg){h.cd=.1;const a=Math.atan2(tg.y-h.y,tg.x-h.x)+(Math.random()-.5)*.2;bullets.push({x:h.x+Math.cos(a)*20,y:h.y+Math.sin(a)*20,vx:Math.cos(a)*620,vy:Math.sin(a)*620,life:.55,dmg:8,team:0});h.flashT=time+.05;snd('smg',h.x,h.y)}
    }
    if(past(h.endX))h.dead=true;
  }
  helis=helis.filter(h=>!h.dead);

  // --- spawns ---
  let alive=aliens.filter(e=>e!==queen).length;
  for(const n of nests){   // les nids pondent tant que la limite n'est pas atteinte
    if(n.dead||(MODE==='nests'&&!CAMP.s.pc))continue;   // mission 1 : les nids dorment tant que le terminal n'a pas été utilisé
    n.t-=dt;
    if(n.t<=0){
      n.t=(MODE==='survive'?8:MODE==='nests'?7:11)+Math.random()*5;
      if(alive<(MODE==='survive'?80:44)&&soldiers().length>0){
        const k=Math.random()<.4?2:1;
        for(let i=0;i<k;i++){const r=Math.random();spawnAlien(r<.06&&time>40?'brute':r<.24?'spitter':'scout',n.x+(Math.random()-.5)*26,n.y+(Math.random()-.5)*26);alive++}
        burst(n.x,n.y,8,'#8a5a30',90,.5,3);
      }
    }
  }
  if(MODE==='queen'){
    // la reine s'affole quand des soldats approchent : elle pond deux fois plus vite
    queenSpawnT-=dt*(ss.some(s=>dist(s,queen)<520)?2:1);
    if(queenSpawnT<=0&&alive<40){queenSpawnT=2.0;spawnAlien('scout',queen.x+Math.random()*40-20,queen.y+Math.random()*40-20)}
    bruteT-=dt;
    if(bruteT<=0&&alive<40){bruteT=10;spawnAlien('brute',queen.x,queen.y+40)}
    spitT-=dt;
    if(spitT<=0&&alive<40){spitT=7;spawnAlien('spitter',queen.x-30,queen.y+30)}
  }else if(MODE==='survive'){
    const rate=Math.max(.4,1.9-time/60)*(player2?.75:1);   // à deux, ça arrive plus vite
    spawnT-=dt;
    if(spawnT<=0&&alive<80){
      spawnT=rate;const hh=holes[Math.random()*holes.length|0];
      const r=Math.random();
      spawnAlien(r<.12+time/1000?'brute':(r<.32&&time>25)?'spitter':'scout',hh[0]*TS+TS/2,hh[1]*TS+TS/2);
    }
  }else if(MODE==='relay'){   // mission 2 : vagues venues du bord de la carte, de plus en plus fournies
    const rate=Math.max(.5,1.4-time/110)*(player2?.8:1);
    spawnT-=dt;
    if(spawnT<=0&&alive<60){
      spawnT=rate;const hh=holes[Math.random()*holes.length|0];
      const r=Math.random();
      spawnAlien(r<.06+time/1300?'brute':(r<.32&&time>12)?'spitter':'scout',hh[0]*TS+TS/2,hh[1]*TS+TS/2);
    }
  }

  fx.forEach(e=>e.t-=dt);fx=fx.filter(e=>e.t>0);updateParts(dt);
  texts.forEach(e=>{e.t-=dt;e.y-=14*dt});texts=texts.filter(e=>e.t>0);
  shake=Math.max(0,shake-dt*20);

  // --- fin de partie ---
  if(humans().length===0&&!canRespawn()){over=true;msgText='lose.dead';snd('defeat')}
  else if(MODE==='queen'&&queen.hp<=0){over=true;msgText='win.queen';snd('victory')}
  else if(MODE==='queen'&&time>=QUEEN_TIME){over=true;msgText='lose.time';snd('defeat')}
  else if(MODE==='survive'&&time>=SURVIVE_TIME){over=true;msgText='win.survive';snd('victory')}
  else if(MODE==='relay'&&relay.dead){over=true;msgText='lose.relay';snd('defeat')}
  else if(MODE==='relay'&&relay.prog>=RELAY_TIME){over=true;msgText='win.relay';snd('victory')}
  else if(MODE==='nests'&&CAMP.s.pc&&nests.every(n=>n.dead)){over=true;msgText='win.nests';snd('victory')}
}

const ADARK={scout:'#4a1658',brute:'#52200c',spitter:'#16501f',queen:'#6e1636'};
function rrect(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function panel(x,y,w,h){g.fillStyle='rgba(8,12,22,.74)';rrect(x,y,w,h,9);g.fill();g.strokeStyle='rgba(140,170,220,.28)';g.lineWidth=1;g.stroke()}
function hex(x,y,r){g.beginPath();for(let i=0;i<6;i++){const a=i*Math.PI/3+Math.PI/6;g.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}g.closePath()}
function glow(x,y,r,col,a){ // lueur additive (objets lumineux)
  const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,col);gr.addColorStop(1,'rgba(0,0,0,0)');
  g.save();g.globalCompositeOperation='lighter';g.globalAlpha=a*(DAY?.5:1);g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2);g.restore();
}
function cut(x,y,r,a){ // trou de lumière dans l'obscurité
  const gr=lg.createRadialGradient(x,y,r*.08,x,y,r);for(let i=0;i<=8;i++){const t=i/8,k=1-t*t*(3-2*t);gr.addColorStop(t,`rgba(0,0,0,${a*k})`)}   // dégradé doux (smoothstep)
  lg.fillStyle=gr;lg.fillRect(x-r,y-r,r*2,r*2);
}
const isWall=(x,y)=>{const t=map[y]&&map[y][x];return t===2||t===6||t===8};

function drawSoldier(s,p){
  const sx=s.x-cam.x,sy=s.y-cam.y;
  const mv=Math.hypot(s.x-(s.px??s.x),s.y-(s.py??s.y))>.15;s.px=s.x;s.py=s.y;
  s.ph=(s.ph||0)+(mv?.32:0);
  if(s.isPlayer){g.strokeStyle=s===me?'rgba(127,233,255,.6)':'rgba(255,190,110,.6)';g.lineWidth=1.6;g.beginPath();g.ellipse(sx,sy+2,s.mech?26:16,s.mech?21:13,0,0,7);g.stroke()}
  if(s.mech)drawMecha(sx,sy,s.face,mv?s.ph:0,s.hurt>0,false);
  else{g.save();g.translate(sx,sy);g.rotate(s.face);
  soldierBody(g,p,mv?s.ph:0,weaponOf(s),s.isPlayer?s.fem:s.lt?!player.fem:(s.id%4===0));
  g.restore()}
  if(time<(s.flashT||0)){ // flamme de bouche
    const fx_=sx+Math.cos(s.face)*(s.mech?40:30),fy_=sy+Math.sin(s.face)*(s.mech?40:30);
    glow(fx_,fy_,20,'rgba(255,225,140,1)',1);glow(fx_,fy_,9,'rgba(255,255,255,1)',1);
  }
  if(s.hurt>0){g.fillStyle='rgba(255,40,40,.35)';g.beginPath();g.arc(sx,sy,s.r+3,0,7);g.fill()}
  if(s!==me&&s.hp<s.maxhp){g.fillStyle='rgba(0,0,0,.7)';g.fillRect(sx-11,sy-19,22,4);g.fillStyle='#5be05b';g.fillRect(sx-10,sy-18,20*s.hp/s.maxhp,2)}
}

function drawAlien(e){
  const sx=e.x-cam.x,sy=e.y-cam.y,d=ALIEN[e.type],r=e.r;
  if(sx<-100||sy<-100||sx>VW+100||sy>VH+100)return;
  const q=e.type==='queen',ph=q?time*1.5:(e.ph||0),pulse=.5+.5*Math.sin(time*(q?2.4:5)+(e.x+e.y)*.01);
  g.save();g.translate(sx,sy);
  g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(2,3,r*1.6,r*1.2,0,0,7);g.fill();
  g.rotate(e.face||0);
  const hurt=e.hurt>0,body=hurt?'#ffffff':d.col,dk=hurt?'#dddddd':ADARK[e.type];
  g.lineCap='round';g.lineJoin='round';
  // pattes articulées
  const legs=[];
  for(let i=0;i<4;i++)for(const s of [-1,1]){
    const sw=Math.sin(ph+i*1.6+(s>0?Math.PI:0))*r*.35,bx=(i-1.5)*r*.5;
    legs.push([bx,s*r*.3,bx+sw*.5+(i-1.5)*r*.18,s*r*1.1,bx+sw+(i-1.5)*r*.5,s*r*1.7]);
  }
  const lw=q?4.2:r>12?3.2:2.2;
  for(const pass of [0,1]){
    g.strokeStyle=pass?(hurt?'#fff':d.legs):'#12060f';g.lineWidth=pass?lw:lw+2;
    g.beginPath();for(const l of legs){g.moveTo(l[0],l[1]);g.lineTo(l[2],l[3]);g.lineTo(l[4],l[5])}g.stroke();
  }
  // abdomen
  g.fillStyle=dk;g.beginPath();g.ellipse(-r*.55,0,r*1.0,r*.76,0,0,7);g.fill();
  g.fillStyle=body;g.beginPath();g.ellipse(-r*.55,0,r*.9,r*.66,0,0,7);g.fill();
  g.fillStyle='rgba(255,255,255,.22)';g.beginPath();g.ellipse(-r*.7,-r*.22,r*.48,r*.22,0,0,7);g.fill();
  if(e.type==='scout'){
    g.strokeStyle=dk;g.lineWidth=r*.14;g.beginPath();for(let k=0;k<3;k++){g.moveTo(-r*1.1+k*r*.34,-r*.5);g.lineTo(-r*1.1+k*r*.34,r*.5)}g.stroke();
  }else if(e.type==='brute'){
    g.strokeStyle=dk;g.lineWidth=2;for(let k=0;k<4;k++){g.beginPath();g.ellipse(-r*.3-k*r*.3,0,r*.12,r*.6,0,0,7);g.stroke()}
    g.fillStyle='#d9c9a0';for(let k=0;k<4;k++){const x=-r*.2-k*r*.32;g.beginPath();g.moveTo(x,-r*.55);g.lineTo(x-r*.12,-r*.9);g.lineTo(x-r*.25,-r*.5);g.fill();g.beginPath();g.moveTo(x,r*.55);g.lineTo(x-r*.12,r*.9);g.lineTo(x-r*.25,r*.5);g.fill()}
  }else if(e.type==='spitter'){
    g.fillStyle=`rgba(${150+pulse*60|0},255,${60+pulse*40|0},.95)`;g.beginPath();g.ellipse(-r*.8,0,r*.55,r*.42,0,0,7);g.fill();
    g.fillStyle='rgba(255,255,255,.55)';g.beginPath();g.ellipse(-r*.95,-r*.12,r*.2,r*.1,0,0,7);g.fill();
  }else if(q){
    g.fillStyle=`rgba(255,${170+pulse*50|0},${200},.35)`;g.beginPath();g.ellipse(-r*.95,0,r*.75,r*.6,0,0,7);g.fill();
    g.fillStyle='rgba(255,240,230,.75)';for(const [x,y] of [[-1.1,-.2],[-.8,.25],[-1.2,.2],[-.9,-.1]]){g.beginPath();g.arc(x*r,y*r,r*.14,0,7);g.fill()}
  }
  // thorax + tête
  g.fillStyle=dk;g.beginPath();g.ellipse(r*.18,0,r*.56,r*.52,0,0,7);g.fill();
  g.fillStyle=body;g.beginPath();g.ellipse(r*.18,0,r*.48,r*.44,0,0,7);g.fill();
  g.fillStyle=dk;g.beginPath();g.ellipse(r*.68,0,r*.46,r*.42,0,0,7);g.fill();
  g.fillStyle=body;g.beginPath();g.ellipse(r*.68,0,r*.39,r*.35,0,0,7);g.fill();
  // mandibules
  const sn=Math.sin(time*7+ph)*r*.07;
  g.strokeStyle=hurt?'#fff':'#e8d9c0';g.lineWidth=Math.max(1.4,r*.14);
  g.beginPath();g.moveTo(r*.98,-r*.14);g.lineTo(r*1.3,-r*.1-sn);g.lineTo(r*1.18,r*.02);g.moveTo(r*.98,r*.14);g.lineTo(r*1.3,r*.1+sn);g.lineTo(r*1.18,-r*.02);g.stroke();
  // yeux
  g.fillStyle=e.type==='spitter'?'#c8ff4a':'#ffe23a';
  const er=Math.max(1.5,r*.1);
  g.beginPath();g.arc(r*.82,-r*.17,er,0,7);g.arc(r*.82,r*.17,er,0,7);
  if(r>12){g.arc(r*.66,-r*.26,er*.8,0,7);g.arc(r*.66,r*.26,er*.8,0,7)}
  g.fill();
  if(q){ // couronne
    g.fillStyle='#ffd0e0';for(let i=-2;i<=2;i++){g.beginPath();g.moveTo(r*.35,i*r*.14-2);g.lineTo(r*.05,i*r*.14*1.7);g.lineTo(r*.35,i*r*.14+2);g.fill()}
  }
  g.restore();
  if(e.hp<e.maxhp&&!q){g.fillStyle='rgba(0,0,0,.7)';g.fillRect(sx-11,sy-r-10,22,4);g.fillStyle='#d65bff';g.fillRect(sx-10,sy-r-9,20*e.hp/e.maxhp,2)}
}

function updateMinimap(){
  const cols=['#5a5240','#46583a','#8a8f9c','#24558f','#a64cc0',null,'#d9b200','#4c7','#e0603a'];
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){mmg.fillStyle=(inFort(x,y)||inYard(x,y))&&map[y][x]!==2&&map[y][x]!==6&&map[y][x]!==7?'#4a5260':cols[map[y][x]];mmg.fillRect(x,y,1,1)}
}

function draw(){
  VW=cv.width/Z;VH=cv.height/Z;
  const ct=!running?{x:NEST.x*TS+Math.sin(time*.25)*70,y:NEST.y*TS+90+Math.cos(time*.2)*30}:(me.hp>0?me:(humans()[0]||me));   // titre : on survole le nid ; mort : on suit le partenaire
  const lk=TOUCH.on?[Math.cos(TOUCH.aim)*70,Math.sin(TOUCH.aim)*70]:[(mouse.x/Z-VW/2)*.25,(mouse.y/Z-VH/2)*.25];
  const tx=ct.x-VW/2+lk[0], ty=ct.y-VH/2+lk[1];
  cam.x+=(tx-cam.x)*.2;cam.y+=(ty-cam.y)*.2;
  cam.x=Math.max(0,Math.min(MW*TS-VW,cam.x));cam.y=Math.max(0,Math.min(MH*TS-VH,cam.y));
  if(MW*TS<VW)cam.x=(MW*TS-VW)/2; if(MH*TS<VH)cam.y=(MH*TS-VH)/2;
  const ox=(Math.random()-.5)*shake,oy=(Math.random()-.5)*shake;
  g.save();g.translate(ox,oy);g.scale(Z,Z);
  g.fillStyle='#07090d';g.fillRect(-12,-12,VW+24,VH+24);
  const x0=Math.max(0,cam.x/TS|0),y0=Math.max(0,cam.y/TS|0),x1=Math.min(MW,x0+Math.ceil(VW/TS)+2),y1=Math.min(MH,y0+Math.ceil(VH/TS)+2);
  const wf=(time*3|0)%4;

  // --- sol ---
  for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){
    const t=map[y][x],px=x*TS-cam.x|0,py=y*TS-cam.y|0,h=hash(x,y);
    if(t===2||t===6)continue;
    if(t===3){
      g.drawImage(spr.water[(wf+(h&3))%4],px,py);
      g.fillStyle='rgba(200,235,255,.3)';
      if(!isWall(x,y-1)&&map[y-1]&&map[y-1][x]!==3)g.fillRect(px,py,TS,2);
      if(map[y+1]&&map[y+1][x]!==3&&map[y+1][x]!==2)g.fillRect(px,py+TS-2,TS,2);
      if(map[y][x-1]!==3)g.fillRect(px,py,2,TS);
      if(map[y][x+1]!==3)g.fillRect(px+TS-2,py,2,TS);
    }else if(t===4)g.drawImage(spr.hole,px,py);
    else if(t===7)g.drawImage(spr.doorO,px,py);
    else if(inFort(x,y)||inYard(x,y)){const i=h%8;g.drawImage(spr.plate[i<5?0:i<6?1:i<7?2:3],px,py)}
    else g.drawImage((t===1?spr.grass:spr.ground)[h&7],px,py);
  }
  // taches persistantes (sang, acide, brûlures)
  {const sx0=Math.max(0,cam.x),sy0=Math.max(0,cam.y),sw=Math.min(dcv.width-sx0,VW-(sx0-cam.x)),sh=Math.min(dcv.height-sy0,VH-(sy0-cam.y));
   if(sw>0&&sh>0)g.drawImage(dcv,sx0,sy0,sw,sh,sx0-cam.x,sy0-cam.y,sw,sh)}

  // --- murs en relief ---
  for(let y=Math.max(0,y0-1);y<y1;y++)for(let x=x0;x<x1;x++){
    const t=map[y][x];if(t!==2&&t!==6)continue;
    const px=x*TS-cam.x|0,py=y*TS-cam.y|0,h=hash(x,y),metal=t===6||inFort(x,y)||inYard(x,y);
    g.drawImage(t===6?spr.doorC:metal?spr.metal[h%3]:spr.rock[h&3],px,py);
    if(!isWall(x,y-1)){g.fillStyle='rgba(255,255,255,.24)';g.fillRect(px,py,TS,2)}
    if(!isWall(x-1,y)){g.fillStyle='rgba(255,255,255,.12)';g.fillRect(px,py,2,TS)}
    if(!isWall(x+1,y)){g.fillStyle='rgba(0,0,0,.28)';g.fillRect(px+TS-2,py,2,TS)}
    if(!isWall(x,y+1)&&y+1<MH){
      g.drawImage(metal?spr.metalFront:spr.rockFront,px,py+TS);
      g.fillStyle='rgba(0,0,0,.2)';g.fillRect(px,py+TS+WALL_H,TS,5);g.fillStyle='rgba(0,0,0,.1)';g.fillRect(px,py+TS+WALL_H+5,TS,4);
    }
    const k=y*MW+x;
    if(thpMax[k]>0&&thp[k]<thpMax[k]){ // fissures selon les dégâts
      const r=1-thp[k]/thpMax[k];g.fillStyle=`rgba(0,0,0,${.12+.4*r})`;g.fillRect(px,py,TS,TS);
      g.strokeStyle='rgba(10,8,6,.85)';g.lineWidth=1.2;g.beginPath();g.moveTo(px+6,py+3);g.lineTo(px+14,py+14);g.lineTo(px+9,py+27);
      if(r>.4){g.moveTo(px+14,py+14);g.lineTo(px+29,py+9)}if(r>.7){g.moveTo(px+14,py+14);g.lineTo(px+25,py+29)}g.stroke();
    }
  }

  // --- armurerie ---
  {const ax=armory.x-cam.x,ay=armory.y-cam.y;
   if(ax>-60&&ay>-60&&ax<VW+60&&ay<VH+60){
    g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(ax+2,ay+8,22,9,0,0,7);g.fill();
    for(const [dx,dy,w] of [[-11,-4,20],[9,-2,18],[-1,-12,20]]){
      g.fillStyle='#5b6140';g.fillRect(ax+dx-w/2,ay+dy-8,w,14);g.fillStyle='#7a8156';g.fillRect(ax+dx-w/2,ay+dy-8,w,3);
      g.fillStyle='#d9b200';g.fillRect(ax+dx-w/2,ay+dy-1,w,2);g.strokeStyle='#2c3020';g.lineWidth=1;g.strokeRect(ax+dx-w/2+.5,ay+dy-7.5,w-1,13);
    }
    g.fillStyle='#ffd34d';for(let i=0;i<3;i++)g.fillRect(ax-6+i*5,ay-22,3,6);
    const near=dist(armory,player)<140;
    if(near){g.font="600 11px 'Segoe UI',sans-serif";g.textAlign='center';g.fillStyle='rgba(255,255,255,.9)';g.fillText(T('h.armory',armory.stock|0),ax,ay+26)}
    glow(ax,ay,38,'rgba(255,210,80,1)',armory.stock>=1?.22:.05);
   }}
  // --- tourelles ---
  for(const t of turrets){
    if(map[t.ty][t.tx]!==8)continue;
    const px=t.tx*TS-cam.x,py=t.ty*TS-cam.y,cx=px+TS/2,cy=py+TS/2,k=t.ty*MW+t.tx,hr=Math.max(0,thp[k]/thpMax[k]);
    if(cx<-40||cy<-40||cx>VW+40||cy>VH+40)continue;
    g.drawImage(spr.metal[0],px|0,py|0);   // la tourelle fait partie du mur
    if(!isWall(t.tx,t.ty+1)){g.drawImage(spr.metalFront,px|0,(py|0)+TS);g.fillStyle='rgba(0,0,0,.2)';g.fillRect(px|0,(py|0)+TS+WALL_H,TS,5)}
    g.fillStyle='#2b3140';rrect(px+2,py+2,TS-4,TS-4,6);g.fill();
    g.fillStyle='#4a5470';rrect(px+3,py+3,TS-6,TS-8,5);g.fill();g.strokeStyle='#8fa0c8';g.lineWidth=1;g.stroke();
    g.save();g.translate(cx,cy);g.rotate(t.face);
    g.fillStyle='#1c2029';g.fillRect(2,-6,20,4);g.fillRect(2,2,20,4);
    g.fillStyle='#596380';g.fillRect(4,-6,10,1.5);g.fillRect(4,2,10,1.5);
    g.fillStyle='#39404f';g.beginPath();g.arc(0,0,9,0,7);g.fill();
    g.fillStyle='#6a76a0';g.beginPath();g.arc(-1,-1,6,0,7);g.fill();
    g.fillStyle=hr>.5?'#5cff8a':hr>.25?'#ffc24a':'#ff5a4a';g.beginPath();g.arc(0,0,2.2,0,7);g.fill();
    g.restore();
    if(time<t.flashT){const a=t.face;glow(cx+Math.cos(a)*24,cy+Math.sin(a)*24,20,'rgba(255,225,140,1)',1)}
    if(hr<1){g.fillStyle='rgba(0,0,0,.7)';g.fillRect(px+2,py-6,TS-4,4);g.fillStyle=hr>.5?'#5cff8a':hr>.25?'#ffc24a':'#ff5a4a';g.fillRect(px+3,py-5,(TS-6)*hr,2)}
  }
  for(const n of nests)drawNest(n);
  drawReactor();drawRelay();drawTerminal();
  for(const m of mechas){
    const mx_=m.x-cam.x,my_=m.y-cam.y;if(mx_<-60||my_<-60||mx_>VW+60||my_>VH+60)continue;
    const p=.5+.5*Math.sin(time*4);g.strokeStyle='rgba(255,210,60,'+(.3+.4*p)+')';g.lineWidth=2;g.beginPath();g.arc(mx_,my_,27+p*3,0,7);g.stroke();
    drawMecha(mx_,my_,m.face,0,false,true);
    if(me.hp>0&&!me.mech&&dist(m,me)<110){g.font="600 11px 'Segoe UI',sans-serif";g.textAlign='center';g.fillStyle='rgba(255,255,255,.92)';g.fillText(T('h.boardMech'),mx_,my_+36)}
  }
  // --- frères d'armes tombés ---
  for(const c of corpses){
    c.rot??=Math.random()*6.28;
    g.save();g.translate(c.x-cam.x,c.y-cam.y);g.rotate(c.rot);g.drawImage(spr.corpse,-22,-22);g.restore();
    if(c.ammo>0){const p=.5+.5*Math.sin(time*5),cx=c.x-cam.x,cy=c.y-cam.y;
      g.strokeStyle=`rgba(255,235,110,${.35+.5*p})`;g.lineWidth=2;g.beginPath();g.arc(cx,cy,15+p*3,0,7);g.stroke();
      g.fillStyle='rgba(255,215,60,.95)';g.fillRect(cx-5,cy-12-p*2,3,6);g.fillRect(cx-1,cy-12-p*2,3,6);g.fillRect(cx+3,cy-12-p*2,3,6)}
  }
  // --- bonus ---
  for(const b of bonuses){
    const p=.5+.5*Math.sin(b.t*5),d=BONUS[b.type],bx=b.x-cam.x,by=b.y-cam.y,bob=Math.sin(b.t*3)*2;
    g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(bx+2,by+9,10,4,0,0,7);g.fill();
    g.strokeStyle=d.c;g.globalAlpha=.3+.4*p;g.lineWidth=2;g.beginPath();g.arc(bx,by-bob,17+p*5,0,7);g.stroke();g.globalAlpha=1;
    hex(bx,by-bob,12);g.fillStyle='#10151f';g.fill();g.strokeStyle=d.c;g.lineWidth=2;g.stroke();
    g.fillStyle=d.c;g.font="bold 13px 'Segoe UI',sans-serif";g.textAlign='center';g.fillText(d.l,bx,by-bob+4.5);
    const lb=WEAPONS[b.type]?WEAPONS[b.type].name:d.name;
    if(lb){g.font="600 10px 'Segoe UI',sans-serif";g.fillStyle='rgba(255,255,255,.85)';g.fillText(lb,bx,by-bob+27)}
  }
  // --- aliens, alliés, joueur ---
  for(const e of aliens)drawAlien(e);
  const near=nearestAlly(ORDER_RANGE,me);
  for(const a of allies){
    drawSoldier(a,a.lt?PAL.p2:PAL.ally);
    if(a.lt){g.font="600 11px 'Segoe UI',sans-serif";g.textAlign='center';g.fillStyle='rgba(255,210,150,.95)';g.fillText(T('n.lyra'),a.x-cam.x,a.y-cam.y-34)}
    g.font="bold 12px 'Segoe UI',sans-serif";g.textAlign='center';g.fillStyle=a.order==='hold'?'#ffcc66':a.order==='follow'?'#66ccff':'#99ee99';
    if(!a.lt)g.fillText(ORDER_ICON[a.order],a.x-cam.x,a.y-cam.y-(a.hp<a.maxhp?25:18));
    if(near&&!a.lt&&dist(a,player)<ORDER_RANGE){g.strokeStyle='rgba(150,200,255,.45)';g.lineWidth=1;g.beginPath();g.arc(a.x-cam.x,a.y-cam.y,15,0,7);g.stroke()}
    if(a===near){g.fillStyle='rgba(255,255,255,.85)';g.font="11px 'Segoe UI',sans-serif";g.fillText(T('h.orderHint',ordTxt(a.order)),a.x-cam.x,a.y-cam.y+32)}
  }
  for(const h of [player,player2]){
    if(!h||h.hp<=0)continue;
    drawSoldier(h,h===player?PAL.player:PAL.p2);
    if(h!==me){g.font="600 11px 'Segoe UI',sans-serif";g.textAlign='center';g.fillStyle='rgba(255,210,150,.95)';g.fillText(h===player?'J1':'J2',h.x-cam.x,h.y-cam.y-26)}
  }

  // --- projectiles ---
  g.lineCap='round';

  {let n=0;for(const b of bullets){if(n++>16)break;L(b.x,b.y,b.acid?75:b.flame?95:b.rocket?110:55,.85)}}
  g.drawImage(lc,0,0);
  }

   const low=me.hp>0&&me.hp<me.maxhp*.3?(.5+.5*Math.sin(time*6))*.35:0,a=Math.max(me.hurt>0?me.hurt*1.6:0,low);
   if(a>0){const rg=g.createRadialGradient(w/2,h/2,Math.min(w,h)*.3,w/2,h/2,Math.hypot(w,h)*.55);rg.addColorStop(0,'rgba(200,0,0,0)');rg.addColorStop(1,`rgba(200,0,0,${Math.min(.6,a)})`);g.fillStyle=rg;g.fillRect(0,0,w,h)}}

function bar(x,y,w,h,v,c1,c2,label,val){
  g.fillStyle='rgba(0,0,0,.55)';rrect(x,y,w,h,h/2);g.fill();
  const fw=Math.max(0,Math.min(1,v))*(w-2);
  if(fw>0){const gr=g.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,c1);gr.addColorStop(1,c2);g.fillStyle=gr;rrect(x+1,y+1,fw,h-2,(h-2)/2);g.fill();
    g.fillStyle='rgba(255,255,255,.22)';rrect(x+2,y+2,Math.max(0,fw-2),(h-2)/2.4,2);g.fill()}
  g.fillStyle='#fff';g.font="600 11px 'Segoe UI',sans-serif";g.textAlign='left';g.fillText(label,x+8,y+h-4.5);
  if(val!==undefined){g.textAlign='right';g.fillText(val,x+w-8,y+h-4.5)}
}

// ============ Audio : musique et bruitages synthétisés (WebAudio), aucun fichier ============
const AUD={ctx:null,muted:false,master:null,mus:null,sfx:null,verb:null,delay:null,noise:null,last:{},voices:0,trk:null,cur:undefined,int:0};
try{AUD.muted=localStorage.getItem('nb_mute')==='1'}catch(e){}
const VOL={mus:1,sfx:1};   // réglages du menu pause (0..1), appliqués sur les gains de base (musique .5, effets .9)
try{const m=localStorage.getItem('nb_vol_mus'),f=localStorage.getItem('nb_vol_sfx');if(m!==null)VOL.mus=Math.max(0,Math.min(1,+m));if(f!==null)VOL.sfx=Math.max(0,Math.min(1,+f))}catch(e){}
function applyVolumes(){
  if(!AUD.ctx)return;const t=AUD.ctx.currentTime;
  for(const [node,v] of [[AUD.mus,.5*VOL.mus],[AUD.sfx,.9*VOL.sfx]]){node.gain.cancelScheduledValues(t);node.gain.setValueAtTime(v,t)}   // valeur directe : un setTarget* sur un noeud au repos ne rattrape pas son retard
}

function audioInit(){ // appelé à chaque geste utilisateur : crée le contexte la 1re fois, le relance s'il est suspendu
  if(AUD.ctx){if(AUD.ctx.state==='suspended')AUD.ctx.resume();return}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  const c=AUD.ctx=new AC();
  const comp=c.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=5;comp.connect(c.destination);
  AUD.master=c.createGain();AUD.master.gain.value=AUD.muted?0:.9;AUD.master.connect(comp);
  AUD.mus=c.createGain();AUD.mus.gain.value=.5;AUD.mus.connect(AUD.master);
  AUD.sfx=c.createGain();AUD.sfx.gain.value=.9;AUD.sfx.connect(AUD.master);
  const n=c.createBuffer(1,c.sampleRate*2,c.sampleRate),d=n.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  AUD.noise=n;
  const len=Math.floor(c.sampleRate*2.6),ir=c.createBuffer(2,len,c.sampleRate);   // réverbération : bruit qui s'éteint
  for(let ch=0;ch<2;ch++){const dd=ir.getChannelData(ch);for(let i=0;i<len;i++)dd[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}
  AUD.verb=c.createConvolver();AUD.verb.buffer=ir;
  const vg=c.createGain();vg.gain.value=.55;AUD.verb.connect(vg);vg.connect(AUD.mus);
  AUD.delay=c.createDelay(1);AUD.delay.delayTime.value=.375;                         // écho
  const fb=c.createGain();fb.gain.value=.38;AUD.delay.connect(fb);fb.connect(AUD.delay);
  const dg=c.createGain();dg.gain.value=.5;AUD.delay.connect(dg);dg.connect(AUD.mus);
  applyVolumes();
  setInterval(musicTick,50);
  if(AUD.ctx.state==='suspended')AUD.ctx.resume();
}
function setMute(m){
  AUD.muted=m;
  try{localStorage.setItem('nb_mute',m?'1':'0')}catch(e){}
  if(AUD.ctx){const t=AUD.ctx.currentTime;AUD.master.gain.cancelScheduledValues(t);AUD.master.gain.setValueAtTime(m?0:.9,t)}
  updateMuteUI();
}
function updateMuteUI(){
  const a=document.getElementById('mMute'),b=document.getElementById('tMute');
  if(a)a.textContent=T(AUD.muted?'soundOff':'soundOn');
  if(b)b.textContent=AUD.muted?'✖':'♪';
  const pm=document.getElementById('pMute');if(pm)pm.textContent=T(AUD.muted?'soundOff':'soundOn');
}

// ---- briques de synthèse ----
function osc(type,f0,f1,t,dur,vol,dest,o){
  o=o||{};
  const c=AUD.ctx,os=c.createOscillator(),g=c.createGain();
  os.type=type;os.frequency.setValueAtTime(f0,t);
  if(f1&&f1!==f0)os.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  if(o.det)os.detune.value=o.det;
  let out=os;
  if(o.lp){const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=o.lp;f.Q.value=o.q||1;os.connect(f);out=f}
  const a=o.a||.005,r=Math.min(o.r||.05,dur*.6);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+a);
  g.gain.setValueAtTime(vol,t+Math.max(a,dur-r));g.gain.linearRampToValueAtTime(.0001,t+dur);
  out.connect(g);g.connect(dest);os.start(t);os.stop(t+dur+.05);
  if(o.send)for(const s of o.send){const sg=c.createGain();sg.gain.value=s.amt;g.connect(sg);sg.connect(s.node)}
  return g;
}
function noise(t,dur,vol,dest,o){
  o=o||{};
  const c=AUD.ctx,src=c.createBufferSource(),g=c.createGain(),f=c.createBiquadFilter();
  src.buffer=AUD.noise;src.loop=true;
  f.type=o.type||'bandpass';f.frequency.setValueAtTime(o.f||1000,t);
  if(o.f1)f.frequency.exponentialRampToValueAtTime(Math.max(30,o.f1),t+dur);
  f.Q.value=o.q||1;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+(o.a||.003));g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  src.connect(f);f.connect(g);g.connect(dest);src.start(t,Math.random()*1.5);src.stop(t+dur+.05);
  if(o.send)for(const s of o.send){const sg=c.createGain();sg.gain.value=s.amt;g.connect(sg);sg.connect(s.node)}
}

const SFX_MIN={blip:.02,codecCall:.3,smg:.045,pistol:.1,flame:.09,hitA:.05,dieA:.06,turret:.07,bite:.08,crumble:.1,boom:.05,spit:.1,screech:.25,pickup:.08,acidHit:.06};
const SFX_RANGE={boom:1100,rocket:800,shotgun:800,roar:1000,siren:900};
function playSfx(n,x,y){ // x,y absents : son non positionnel (plein volume au centre)
  const c=AUD.ctx;if(!c||AUD.muted||c.state!=='running')return;
  const def=SFXDEF[n];if(!def)return;
  const now=c.currentTime;
  if(now-(AUD.last[n]||-9)<(SFX_MIN[n]||.03))return;
  let vol=1,pan=0;
  if(x!==undefined&&y!==undefined&&me){
    const d=Math.hypot(x-me.x,y-me.y),rg=SFX_RANGE[n]||650;
    if(d>rg)return;
    vol=Math.pow(1-d/rg,1.4);pan=Math.max(-1,Math.min(1,(x-me.x)/450));
  }
  if(vol<.04||AUD.voices>40)return;
  AUD.last[n]=now;
  const g=c.createGain();g.gain.value=vol;
  if(c.createStereoPanner){const p=c.createStereoPanner();p.pan.value=pan;g.connect(p);p.connect(AUD.sfx)}else g.connect(AUD.sfx);
  AUD.voices++;setTimeout(()=>{AUD.voices--},600);
  def(now+.005,g);
}
function snd(n,x,y){ev({k:'a',n:n,x:x,y:y});playSfx(n,x,y)}   // hôte : joue ici et prévient l'invité

function kick(t,bus,v){osc('sine',150,42,t,.2,v,bus,{r:.1});noise(t,.02,v*.3,bus,{type:'highpass',f:2000})}
function snare(t,bus,v){noise(t,.13,v,bus,{f:1800,q:.7});osc('triangle',200,120,t,.08,v*.5,bus)}
function hat(t,bus,v){noise(t,.04,v,bus,{type:'highpass',f:7000})}
function tom(t,bus,v){osc('sine',150,65,t,.26,v,bus,{r:.15});noise(t,.06,v*.3,bus,{type:'lowpass',f:700})}
function padVoice(fr,t,dur,p,bus){
  const c=AUD.ctx,g=c.createGain(),f=c.createBiquadFilter();
  f.type='lowpass';f.frequency.value=p.lp;f.Q.value=.7;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(p.vol,t+dur*.35);g.gain.linearRampToValueAtTime(.0001,t+dur*1.1);
  for(const det of [-7,7]){const o=c.createOscillator();o.type=p.wave;o.frequency.value=fr;o.detune.value=det;o.connect(f);o.start(t);o.stop(t+dur*1.15)}
  f.connect(g);g.connect(bus);const s=c.createGain();s.gain.value=.6;g.connect(s);s.connect(AUD.verb);
}
function playStep(tr,s,t){
  const sd=tr.stepDur,step=s%16,bar=Math.floor(s/16)%tr.prog.length,deg=tr.prog[bar],I=AUD.int,bus=tr.bus,L=tr.scale.length;
  const note=(d,oct)=>tr.root+tr.scale[((d%L)+L)%L]+12*(Math.floor(d/L)+(oct||0));
  const fq=m=>440*Math.pow(2,(m-69)/12);
  if(step===0&&tr.pad)for(const k of [0,2,4])padVoice(fq(note(deg+k,0)),t,sd*16,tr.pad,bus);
  const b=tr.bass.pat[step];
  if(b!==null&&b!==undefined){const fr=fq(note(deg+b,tr.bass.oct));osc(tr.bass.wave,fr,fr*.996,t,sd*1.6,tr.bass.vol,bus,{lp:tr.bass.lp,a:.01,r:.08})}
  const a=tr.arp.pat[step];
  if(a!==null&&a!==undefined&&I>=(tr.arp.minInt||0)){
    const fr=fq(note(deg+[0,2,4,7][a%4],tr.arp.oct));
    const sends=tr.arp.echo?[{node:AUD.delay,amt:.5},{node:AUD.verb,amt:.45}]:[{node:AUD.verb,amt:.3}];
    if(tr.arp.bell){osc('sine',fr,fr,t,.9,tr.arp.vol,bus,{send:sends,r:.8});osc('sine',fr*2.76,fr*2.76,t,.4,tr.arp.vol*.35,bus,{send:sends,r:.35})}
    else osc('triangle',fr,fr,t,.28,tr.arp.vol,bus,{lp:2400,send:sends,r:.2});
  }
  if(tr.bubbles&&Math.random()<.14){const fr=300+Math.random()*700;osc('sine',fr,fr*1.6,t+Math.random()*sd,.12,.05,bus,{send:[{node:AUD.verb,amt:.6}]})}
  const d=tr.drums;
  if(d){
    if(d.kick&&d.kick.indexOf(step)>=0&&I>=(d.kickInt||0))kick(t,bus,d.kv||.5);
    if(d.snare&&d.snare.indexOf(step)>=0&&I>=(d.snareInt===undefined?.3:d.snareInt))snare(t,bus,.2);
    if(d.hat&&d.hat.indexOf(step)>=0&&I>=(d.hatInt===undefined?.5:d.hatInt))hat(t,bus,.1+I*.05);
    if(d.tom&&d.tom.indexOf(step)>=0&&I>=(d.tomInt===undefined?.5:d.tomInt))tom(t,bus,.35);
  }
}
function startAmb(tr){
  const c=AUD.ctx,nodes=[],a=tr.amb||[];
  if(a.indexOf('wind')>=0){
    const src=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain(),lfo=c.createOscillator(),lg=c.createGain();
    src.buffer=AUD.noise;src.loop=true;f.type='bandpass';f.frequency.value=tr.windF||600;f.Q.value=.7;g.gain.value=.05;
    lfo.frequency.value=.13;lg.gain.value=.03;lfo.connect(lg);lg.connect(g.gain);
    src.connect(f);f.connect(g);g.connect(tr.bus);src.start();lfo.start();nodes.push(src,lfo);
  }
  if(a.indexOf('drone')>=0){
    const m=tr.root-12;
    for(const det of [-5,5]){const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=440*Math.pow(2,(m-69)/12);o.detune.value=det;g.gain.value=.07;o.connect(g);g.connect(tr.bus);o.start();nodes.push(o)}
  }
  return nodes;
}
function setTrack(id){
  const c=AUD.ctx;if(!c||AUD.cur===id)return;
  const now=c.currentTime;
  if(AUD.trk){ // fondu sortant de l'ancien morceau
    const old=AUD.trk;old.bus.gain.cancelScheduledValues(now);old.bus.gain.setTargetAtTime(0,now,.7);
    setTimeout(()=>{(old.ambNodes||[]).forEach(n=>{try{n.stop()}catch(e){}});try{old.bus.disconnect()}catch(e){}},4500);
  }
  AUD.cur=id;AUD.trk=null;
  if(!id||!TRACKS[id])return;
  const tr=Object.assign({},TRACKS[id]);
  tr.bus=c.createGain();tr.bus.gain.value=0;tr.bus.connect(AUD.mus);tr.bus.gain.setTargetAtTime(1,now+.05,1.2);
  tr.stepDur=60/tr.bpm/4;tr.step=0;tr.next=now+.15;tr.ambNodes=startAmb(tr);
  AUD.trk=tr;
}

  const c=AUD.ctx,tr=AUD.trk;if(!c||!tr||c.state!=='running')return;
  if(tr.next<c.currentTime-.4)tr.next=c.currentTime+.05;   // onglet resté en arrière-plan : on ne rejoue pas le retard

}
function audioTick(dt){ // choix du morceau (menu / monde) et intensité selon les aliens proches
  if(!AUD.ctx)return;
  const want=!running?'menu':(over?null:WORLD.id);
  let tgt=0;
  if(running&&!over&&me){
    let n=0;for(const e of aliens)if(e.hp>0&&e.type!=='queen'&&Math.hypot(e.x-me.x,e.y-me.y)<430)n++;

const gA=new Map(), gE=new Map(), gB=new Map(), gC=new Map();

function applySnap(s){

    if(!d)return;
    p.hp=d[3];p.ammo=d[4];p.grenades=d[5];p.maxhp=d[8];p.weapon=WIDX[d[9]]||'pistol';p.respT=d[10]||0;if(d[11]){p.mech={hp:d[11],max:d[12]||80,rk:d[13]|0};p.r=14}else if(p.mech){p.mech=null;p.r=9}

    if(d[7])p.hurt=.2;

      if(Math.hypot(p.x-d[0],p.y-d[1])>60){p.x=d[0];p.y=d[1]}
      else{p.x+=(d[0]-p.x)*.35;p.y+=(d[1]-p.y)*.35}
    }else{
      if(p.tx===undefined){p.x=d[0];p.y=d[1]}
      p.tx=d[0];p.ty=d[1];p.tface=d[2];

  setH(player,s.p[0],false);setH(player2,s.p[1],true);

  const seenA=new Set();allies=[];
  for(const d of s.a){
    let a=gA.get(d[0]);
    if(!a){a={id:d[0],x:d[1],y:d[2],r:9,isPlayer:false,face:d[3],ph:0,walk:0,inv:0};gA.set(d[0],a)}
    a.tx=d[1];a.ty=d[2];a.tface=d[3];a.hp=d[4];a.maxhp=d[5];a.order=ORDERS[d[6]];
    if(d[7])a.flashT=time+.06;if(d[8])a.hurt=.2;a.ammo=d[9];
    seenA.add(d[0]);allies.push(a);
  }
  for(const k of gA.keys())if(!seenA.has(k))gA.delete(k);
  // aliens
  const seenE=new Set();aliens=[];queen=null;
  for(const d of s.e){
    let e=gE.get(d[0]);const type=TYPES[d[1]];
    if(!e){e={id:d[0],type,x:d[2],y:d[3],r:ALIEN[type].r,face:d[4],ph:Math.random()*6,cd:0};gE.set(d[0],e)}
    e.tx=d[2];e.ty=d[3];e.tface=d[4];e.hp=d[5];e.maxhp=d[6];if(d[7])e.hurt=.1;
    if(type==='queen')queen=e;
    seenE.add(d[0]);aliens.push(e);
  }
  for(const k of gE.keys())if(!seenE.has(k))gE.delete(k);
  bullets=s.b.map(b=>({x:b[0],y:b[1],vx:b[2],vy:b[3],acid:b[4]===1,flame:b[4]===2,rocket:b[4]===3,life:b[5]}));
  grenades=s.g.map(a=>({x:a[0],y:a[1],t:a[2]}));
  shells=s.s.map(a=>({x:a[0],y:a[1],t:a[2]}));
  drops=s.dr.map(a=>({x:a[0],y:a[1],t:a[2],n:a[3]}));
  const keep=(map_,list,mkObj)=>{const seen=new Set(),out=[];for(const d of list){const k=d[0]+'_'+d[1];let o=map_.get(k);if(!o){o=mkObj(d);map_.set(k,o)}else Object.assign(o,mkObj(d,o));seen.add(k);out.push(o)}for(const k of map_.keys())if(!seen.has(k))map_.delete(k);return out};
  bonuses=keep(gB,s.bo,(d,o)=>({x:d[0],y:d[1],type:BTYPES[d[2]],ammo:d[3],t:o?o.t:0}));
  corpses=keep(gC,s.co,(d,o)=>({x:d[0],y:d[1],ammo:d[2],rot:o?o.rot:Math.random()*6.28}));
  turrets.forEach((t,i)=>{const d=s.tu[i];if(d){t.tface=d[0];if(d[1])t.flashT=time+.06}});
  armory.stock=s.ar;
  mechas=(s.mc||[]).map(d=>({x:d[0],y:d[1],hp:d[2],max:d[3],face:d[4],rk:d[5]|0}));
  helis=(s.he||[]).map(d=>({x:d[0],y:d[1],vx:d[2],flashT:d[3]?time+.05:0}));
  nests.forEach((n,i)=>{const hp=s.ne&&s.ne[i];if(hp!==undefined){if(hp<n.hp)n.hurt=.1;n.hp=hp;n.dead=hp<=0}});
  if(reactor&&s.rx!==undefined){if(s.rx<reactor.hp)reactor.hurt=.2;reactor.hp=s.rx}
  deaths=s.dc|0;CAMP.s.pc=s.pc|0;
  if(relay&&s.rl){if(s.rl[0]<relay.hp)relay.hurt=.2;relay.hp=s.rl[0];relay.prog=s.rl[1];relay.dead=relay.hp<=0}
  for(const [i,t,hp] of s.tl){const y=(i/MW)|0,x=i%MW;map[y][x]=t;thp[i]=hp}

  for(const e of s.ev){
    switch(e.k){
      case'b':burst(...e.a);break;
      case'd':decal(...e.a);break;
      case's':scorch(...e.a);break;
      case'f':fx.push(e.e);break;
      case'x':texts.push(e.o);break;

function updateGuest(dt){
  time+=dt;
  if(!running)return;
  // entrée locale + déplacement prédit (l'hôte corrige doucement)
  const inp=humanInput(me);
  if(me.hp>0){
    const l=Math.max(1,Math.hypot(inp.mx,inp.my)),sp=me.mech?(inp.fire?80:100):(inp.fire?95:125);
    tryMove(me,inp.mx/l*sp*dt,inp.my/l*sp*dt);
    me.face=inp.aim;
  }
  NET.inT-=dt;
  if(NET.inT<=0){NET.inT=.033;netSend({t:'in',mx:r2(inp.mx),my:r2(inp.my),aim:r2(inp.aim),fire:inp.fire?1:0})}
  // lissage des entités distantes
  const k=Math.min(1,dt*16);
  const smooth=(e,isAlien)=>{
    if(e.tx===undefined)return;
    const ox=e.x,oy=e.y;
    e.x+=(e.tx-e.x)*k;e.y+=(e.ty-e.y)*k;
    e.face=angLerp(e.face,e.tface,k);
    if(isAlien)e.ph=(e.ph||0)+Math.hypot(e.x-ox,e.y-oy)*.1;
    e.hurt-=dt;
  };
  smooth(player,false);
  for(const a of allies)smooth(a,false);
  for(const e of aliens)if(e.type!=='queen')smooth(e,true);else{e.hurt-=dt;e.face=angLerp(e.face,e.tface,k)}
  player2.hurt-=dt;
  for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt}
  for(const x of grenades)x.t-=dt;
  for(const x of shells)x.t-=dt;
  for(const x of drops)x.t-=dt;
  bonuses.forEach(b=>b.t+=dt);
  for(const t of turrets)if(t.tface!==undefined)t.face=angLerp(t.face,t.tface,k);
  for(const n of nests)n.hurt-=dt;
  if(reactor)reactor.hurt-=dt;
  if(relay)relay.hurt-=dt;
  for(const h of helis)h.x+=h.vx*dt;
  fx.forEach(e=>e.t-=dt);fx=fx.filter(e=>e.t>0);updateParts(dt);
  texts.forEach(e=>{e.t-=dt;e.y-=14*dt});texts=texts.filter(e=>e.t>0);
  shake=Math.max(0,shake-dt*20);
}
